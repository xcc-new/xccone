<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在家吃什么 · 家常菜点单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2327463A'/%3E%3Cpath d='M16 8c-2.6 0-4 1.4-4 4v4h8v-4c0-2.6-1.4-4-4-4z' fill='%23F3EEE2'/%3E%3Crect x='14' y='17' width='4' height='7' rx='1.5' fill='%23C94F2C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3EEE2;
  --paper:#FDFBF4;
  --ink:#2B2620;
  --ink-2:#6B6154;
  --ink-3:#9A8F7E;
  --line:#E2D9C6;
  --brand:#27463A;
  --brand-2:#3E6251;
  --accent:#C94F2C;
  --c-pork:#D2533C;  --c-pork-soft:#F6E3DD;
  --c-poultry:#E09B2D; --c-poultry-soft:#F7EAD1;
  --c-beef:#8C3F26;  --c-beef-soft:#F0DFD7;
  --c-veg:#4C7A52;   --c-veg-soft:#E3EBDF;
  --c-tofu:#A07A3C;  --c-tofu-soft:#F0E8D6;
  --c-egg:#E3A72F;   --c-egg-soft:#FAF0D5;
  --radius:10px;
  --shadow:0 10px 30px rgba(43,38,32,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* ===== 顶部 ===== */
.app-head{
  background:var(--brand);
  color:#F3EEE2;
  padding:18px 22px 0;
}
.head-inner{
  max-width:1280px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  padding-bottom:16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-right:auto;
}
.brand-mark{
  width:44px;height:44px;
  border-radius:12px;
  background:var(--brand-2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand h1{
  font-family:"Noto Serif SC",serif;
  font-size:24px;font-weight:900;
  letter-spacing:1px;
  line-height:1.2;
}
.brand p{
  font-size:12px;color:#B9C7BE;
  letter-spacing:1px;
}
.head-tools{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.people-pick{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:999px;
  padding:4px 12px;
  font-size:13px;
  color:#E8EFEA;
}
.people-pick .pp-btn{
  width:28px;height:28px;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.people-pick .pp-btn:hover{background:var(--accent)}
.people-pick b{font-size:15px;min-width:22px;text-align:center}
.btn-shuffle{
  display:flex;align-items:center;gap:7px;
  background:var(--accent);
  color:#fff;
  font-size:13px;font-weight:700;
  padding:10px 16px;
  border-radius:999px;
  transition:transform .1s, background .15s;
  white-space:nowrap;
}
.btn-shuffle:hover{background:#B03F1F}
.btn-shuffle:active{transform:scale(.96)}
.btn-shuffle2{background:var(--brand-2)}
.btn-shuffle2:hover{background:var(--brand)}
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--paper);
  border-radius:999px;
  padding:9px 14px;
  min-width:200px;
}
.search svg{flex-shrink:0;color:var(--ink-3)}
.search input{
  border:none;outline:none;background:none;
  font-size:13px;color:var(--ink);
  width:100%;
}
.search input::placeholder{color:var(--ink-3)}

/* ===== 分类栏 ===== */
.cat-row{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;gap:8px;
  padding:0 22px 12px;
}
.cat-bar{
  flex:1;min-width:0;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 2px 0;
  scrollbar-width:none;
}
.cat-extra{display:flex;gap:8px;flex-shrink:0}
.cat-btn{
  display:flex;align-items:center;gap:5px;
  padding:8px 14px;border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  color:#DCE4DD;font-size:13px;white-space:nowrap;
  transition:background .15s;
}
.cat-btn:hover{background:rgba(255,255,255,.14)}
.cat-bar::-webkit-scrollbar{display:none}
.cat-tab{
  display:flex;align-items:center;gap:6px;
  padding:8px 15px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  color:#DCE4DD;
  font-size:13px;font-weight:500;
  white-space:nowrap;
  flex-shrink:0;
  transition:background .15s,color .15s;
}
.cat-tab .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.85}
.cat-tab .cnt{
  font-size:11px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  padding:0 7px;
  line-height:18px;
}
.cat-tab:hover{background:rgba(255,255,255,.14)}
.cat-tab.active{background:var(--paper);color:var(--ink);font-weight:700}
.cat-tab.active .cnt{background:var(--brand);color:#fff}

/* ===== 布局 ===== */
.layout{
  max-width:1280px;
  margin:0 auto;
  padding:20px 22px 40px;
  display:grid;
  grid-template-columns:1fr 320px;
  gap:22px;
  align-items:start;
}
.menu-head{
  display:flex;align-items:baseline;gap:10px;
  margin-bottom:14px;
}
.menu-head h2{
  font-family:"Noto Serif SC",serif;
  font-size:20px;font-weight:900;
}
.menu-head .result-count{font-size:12px;color:var(--ink-2)}
.dish-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
}
.dish-grid .last-single{grid-column:1/-1;justify-self:center;width:min(52%,250px)}

/* ===== 菜品卡片 ===== */
.dish-card{
  position:relative;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:7px 10px 9px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:5px;
  transition:transform .12s, box-shadow .15s, border-color .15s;
  cursor:pointer;
  user-select:none;
}
.dish-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.dish-card.added{
  border-color:var(--cat);
  background:var(--cat-soft);
}
.dish-name{
  font-size:14px;font-weight:500;
  padding-right:54px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dish-add{
  width:26px;height:26px;
  border-radius:8px;
  background:var(--cat-soft);
  color:var(--cat);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .15s,color .15s;
}
.dish-card:hover .dish-add{background:var(--cat);color:#fff}
.dish-qty{
  position:absolute;
  top:-8px;right:-8px;
  min-width:24px;height:24px;
  padding:0 6px;
  border-radius:999px;
  background:var(--cat);
  color:#fff;
  font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}
.menu-empty{
  grid-column:1/-1;
  text-align:center;
  color:var(--ink-2);
  padding:60px 0;
  font-size:14px;
}
.menu-empty .big{font-size:15px;font-weight:700;color:var(--ink)}

/* ===== 点菜栏（桌面） ===== */
.cart-panel{
  position:sticky;
  top:14px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.cart-head{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--brand);
  color:#F3EEE2;
  padding:14px 16px;
}
.cart-head h2{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:900;letter-spacing:1px}
.cart-head .cart-info{font-size:11px;color:#B9C7BE;margin-top:2px}
.btn-clear{
  font-size:12px;color:#C9D6CC;
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  padding:4px 10px;
  transition:background .15s;
}
.btn-clear:hover{background:rgba(255,255,255,.12);color:#fff}
.cart-list{
  max-height:52vh;
  overflow-y:auto;
  padding:10px 12px;
}
.cart-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 4px;
  border-bottom:1px dashed var(--line);
  font-size:13px;
}
.cart-item:last-child{border-bottom:none}
.ci-name{
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ci-name .cat-tag{
  display:inline-block;
  font-size:10px;
  background:var(--cat-soft);
  color:var(--cat);
  border-radius:4px;
  padding:1px 5px;
  margin-right:6px;
  vertical-align:1px;
}
.ci-stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ci-btn{
  width:24px;height:24px;
  border-radius:6px;
  background:#F0EBDF;
  color:var(--ink);
  font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.ci-btn:hover{background:var(--cat);color:#fff}
.ci-qty{min-width:18px;text-align:center;font-weight:700;font-size:13px}
.ci-del{
  width:22px;height:22px;
  border-radius:6px;
  color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s;
}
.ci-del:hover{color:#B03F1F;background:#F6E3DD}
.cart-empty{
  text-align:center;
  color:var(--ink-3);
  font-size:13px;
  padding:36px 0 30px;
}
.cart-empty svg{margin-bottom:8px;opacity:.5}
.cart-foot{
  border-top:1px solid var(--line);
  padding:12px 14px;
  background:#F7F2E6;
}
.cart-total{
  font-size:13px;color:var(--ink-2);
  margin-bottom:10px;
}
.cart-total b{font-size:18px;color:var(--accent);font-weight:900;font-family:"Noto Serif SC",serif}
.btn-menu{
  width:100%;
  background:var(--accent);
  color:#fff;
  font-size:14px;font-weight:700;
  padding:11px 0;
  border-radius:9px;
  transition:background .15s;
}
.btn-menu:hover{background:#B03F1F}
.btn-menu:disabled{background:#C9BBA6;cursor:not-allowed}

/* ===== 移动端底部点菜栏 ===== */
.m-cart-bar{
  display:none;
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:40;
  background:var(--brand);
  color:#F3EEE2;
  box-shadow:0 -6px 20px rgba(0,0,0,.18);
  padding:10px 16px;
  align-items:center;
  gap:10px;
}
.m-cart-bar.show{display:flex}
.mc-summary{
  display:flex;align-items:center;gap:10px;
  flex:1;
  cursor:pointer;
}
.mc-badge{
  min-width:30px;height:30px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-weight:900;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.mc-text{font-size:13px;line-height:1.3}
.mc-text b{font-size:15px;font-family:"Noto Serif SC",serif}
.mc-btn{
  background:var(--accent);
  color:#fff;
  font-size:13px;font-weight:700;
  padding:10px 18px;
  border-radius:999px;
  white-space:nowrap;
}
.m-cart-sheet{
  display:none;
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:50;
  background:var(--paper);
  border-radius:16px 16px 0 0;
  max-height:70vh;
  flex-direction:column;
  box-shadow:0 -10px 40px rgba(0,0,0,.25);
}
.m-cart-sheet.show{display:flex}
.mc-sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
  border-bottom:1px solid var(--line);
}
.mc-sheet-head h3{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:900}
.mc-close{
  width:30px;height:30px;
  border-radius:50%;
  background:#F0EBDF;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);
}
.mc-sheet-body{overflow-y:auto;padding:6px 16px}
.mc-sheet-foot{padding:12px 16px;border-top:1px solid var(--line)}
.mc-cover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
.mc-cover.show{display:block}

/* ===== Toast ===== */
.toast{
  position:fixed;
  left:50%;
  bottom:96px;
  transform:translate(-50%,20px);
  background:var(--brand);
  color:#F3EEE2;
  border-radius:999px;
  padding:11px 20px;
  font-size:14px;
  display:flex;align-items:center;gap:10px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s, transform .2s;
  z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  max-width:86vw;
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .t-name{font-weight:700;font-family:"Noto Serif SC",serif;font-size:15px}
.toast .t-act{
  background:var(--accent);
  color:#fff;
  border-radius:999px;
  padding:5px 12px;
  font-size:12px;font-weight:700;
  white-space:nowrap;
}

/* ===== 弹窗 ===== */
.modal-mask{
  position:fixed;inset:0;
  background:rgba(39,32,26,.5);
  z-index:70;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.modal-mask[hidden]{display:none}
.modal{
  background:var(--paper);
  border-radius:14px;
  max-width:520px;
  width:100%;
  max-height:84vh;
  overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.mm-head{
  background:var(--brand);
  color:#F3EEE2;
  padding:16px 20px;
  border-radius:14px 14px 0 0;
  display:flex;align-items:center;justify-content:space-between;
}
.mm-head h3{font-family:"Noto Serif SC",serif;font-size:18px;font-weight:900;letter-spacing:1px}
.mm-head .mm-sub{font-size:11px;color:#B9C7BE;margin-top:2px}
.mm-close{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.14);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.mm-body{padding:16px 20px}
.mm-group{margin-bottom:14px}
.mm-group-title{
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:700;
  margin-bottom:6px;
}
.mm-group-title .g-dot{width:8px;height:8px;border-radius:50%}
.mm-group-title .g-num{font-size:11px;color:var(--ink-3);font-weight:500}
.mm-line{
  display:flex;align-items:center;gap:8px;
  font-size:14px;
  padding:3px 0;
}
.mm-line .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.mm-line .n{flex:1}
.mm-line .x{color:var(--ink-2);font-size:13px}
.mm-summary{
  border-top:1px dashed var(--line);
  padding-top:10px;
  margin-top:6px;
  font-size:13px;color:var(--ink-2);
}
.mm-summary b{color:var(--accent);font-weight:900}
.mm-foot{
  display:flex;gap:10px;
  padding:14px 20px 20px;
  border-top:1px solid var(--line);
}
.mm-foot .btn-ghost{
  flex:1;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 0;
  font-size:13px;font-weight:700;
  color:var(--ink-2);
  transition:background .15s;
}
.mm-foot .btn-ghost:hover{background:#F0EBDF}
.mm-foot .btn-solid{
  flex:1.4;
  background:var(--accent);
  color:#fff;
  border-radius:9px;
  padding:10px 0;
  font-size:13px;font-weight:700;
}
.mm-foot .btn-solid:hover{background:#B03F1F}

/* ===== 打印 ===== */
@media print{
  body{background:#fff}
  .app-head,.cat-bar,.cart-panel,.m-cart-bar,.m-cart-sheet,.mc-cover,.toast{display:none!important}
  .layout{display:block;padding:0}
  .menu-area{display:none}
  .modal-mask{display:none!important}
  #modalMask{position:static;background:none;padding:0;display:block!important}
  #menuModal{max-width:100%;box-shadow:none;border-radius:0;max-height:none;overflow:visible}
  .mm-head{border-radius:0}
  .mm-foot{display:none}
}

/* ===== 筛选 chips（.chip 样式复用：投票弹窗用） ===== */
.chip{
  padding:5px 12px;border-radius:999px;
  background:var(--paper);border:1px solid var(--line);
  font-size:12px;color:var(--ink-2);
  transition:all .15s;
}
.chip:hover{border-color:var(--ink-3)}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.chip .cn{margin-left:4px;font-size:11px;opacity:.7}
.btn-mini{
  font-size:12px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;background:var(--paper);
  transition:all .15s;white-space:nowrap;
}
.btn-mini:hover{border-color:var(--brand);color:var(--brand)}
.btn-mini.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== 菜品卡片 ===== */
.dish-actions{position:absolute;top:7px;right:10px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.dish-view{
  width:24px;height:24px;border-radius:7px;
  background:#F0EBDF;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
}
.dish-view:hover{background:var(--brand-2);color:#fff}
.dish-ok{
  position:absolute;bottom:6px;right:10px;
  font-size:10px;color:var(--c-veg);
  font-weight:700;
}
.dish-tag-flag{
  align-self:flex-start;
  font-size:10px;padding:1px 6px;border-radius:4px;
  background:#F0EBDF;color:var(--ink-3);
}
.dish-card{padding-top:7px}

/* ===== 详情弹窗 ===== */
.dt-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:4px;
}
.dt-head h3{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:900}
.dt-tags{display:flex;gap:6px;flex-wrap:wrap}
.dt-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#F0EBDF;color:var(--ink-2)}
.dt-tag.t1{background:var(--c-pork-soft);color:var(--c-pork)}
.dt-tag.t2{background:var(--c-veg-soft);color:var(--c-veg)}
.dt-tag.t3{background:var(--c-poultry-soft);color:var(--c-poultry)}
.dt-sec{font-size:13px;font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.dt-sec::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
.ing-list{list-style:none}
.ing-list li{
  display:flex;align-items:center;gap:8px;
  font-size:13px;padding:4px 0;color:var(--ink);
}
.ing-list li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;opacity:.6}
.step-list{list-style:none;counter-reset:step}
.step-list li{
  counter-increment:step;
  display:flex;gap:10px;align-items:flex-start;
  font-size:13px;color:var(--ink);line-height:1.7;padding:3px 0;
}
.step-list li::before{
  content:counter(step);
  flex-shrink:0;width:20px;height:20px;border-radius:50%;
  background:var(--brand-2);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;
  margin-top:2px;
}
.dt-note{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.6}

/* ===== 转盘 ===== */
.wheel-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 6px}
.wheel-wrap{position:relative;width:280px;height:280px;flex-shrink:0}
@media (max-width:640px){.wheel-wrap{width:260px;height:260px}}
.wheel{
  width:100%;height:100%;border-radius:50%;
  position:relative;
  transition:transform 4s cubic-bezier(.15,.6,.25,1);
  border:6px solid var(--brand);
  box-shadow:0 12px 30px rgba(0,0,0,.18);
}
.wheel-pin{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
  border-top:20px solid var(--accent);z-index:3;
}
.wheel-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;
  background:var(--paper);border:3px solid var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:16px;color:var(--brand);
  z-index:3;
}
.wheel-label{
  position:absolute;top:50%;left:50%;
  font-size:11px;font-weight:700;color:#fff;
  transform-origin:0 0;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  white-space:nowrap;
}
.wheel-ctrl{display:flex;gap:8px;align-items:center}
.wheel-pool{font-size:12px;color:var(--ink-2);text-align:center}

/* ===== 投票 ===== */
.vote-name-list{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.vote-name-tag{
  font-size:12px;padding:4px 10px;border-radius:999px;
  background:#F0EBDF;color:var(--ink-2);
}
.vote-name-tag.done{background:var(--c-veg-soft);color:var(--c-veg);text-decoration:line-through}
.vote-now{
  font-size:14px;font-weight:700;margin:8px 0;
  font-family:"Noto Serif SC",serif;
}
.vote-now b{color:var(--accent)}
.vote-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:300px;overflow-y:auto;padding:4px}
.vote-pick{
  border:1px solid var(--line);border-radius:8px;padding:8px 6px;
  font-size:12px;background:var(--paper);text-align:center;
  transition:all .12s;
}
.vote-pick:hover{border-color:var(--accent)}
.vote-pick.picked{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:700}
.vote-result-item{
  display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px dashed var(--line);font-size:14px;
}
.vote-result-item .v-name{flex:1}
.vote-result-item .v-bar{width:100px;height:8px;border-radius:4px;background:#F0EBDF;overflow:hidden}
.vote-result-item .v-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.vote-result-item .v-num{font-weight:900;color:var(--accent);min-width:20px;text-align:right}
.vote-winner{
  background:var(--c-pork-soft);border:1px solid var(--c-pork);
  color:var(--c-pork);border-radius:10px;
  padding:10px 14px;margin:10px 0;font-size:14px;
}
.vote-winner b{font-size:18px;font-family:"Noto Serif SC",serif}

/* ===== 历史 / 已吃 ===== */
.his-item{
  border:1px solid var(--line);border-radius:10px;
  margin-bottom:10px;overflow:hidden;
}
.his-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:#F7F2E6;cursor:pointer;
}
.his-head .h-time{font-size:13px;font-weight:700;flex:1}
.his-head .h-meta{font-size:11px;color:var(--ink-2)}
.his-head .h-more{color:var(--ink-3)}
.his-body{display:none;padding:4px 12px 10px;border-top:1px dashed var(--line)}
.his-body.open{display:block}
.his-line{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.his-line .x{color:var(--ink-2)}
.his-line .hl-actions{margin-left:auto;display:flex;gap:6px}
.his-line .hl-btn{font-size:11px;color:var(--brand);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.his-line .hl-btn.del{color:var(--accent)}
.his-line .hl-btn:hover{border-color:currentColor}
.eat-date{font-weight:700;font-size:14px;margin:10px 0 6px;display:flex;align-items:center;gap:8px}
.eat-date .d-num{font-size:11px;color:var(--ink-3);font-weight:500}
.eat-date .today{font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:999px}
.eat-chips{display:flex;flex-wrap:wrap;gap:6px}
.eat-chip{
  font-size:12px;background:var(--c-veg-soft);color:var(--c-veg);
  border-radius:6px;padding:4px 10px;display:flex;align-items:center;gap:6px;
}
.eat-chip button{font-size:11px;color:var(--c-veg);opacity:.7}
.eat-chip button:hover{opacity:1}

/* ===== 购物清单 ===== */
.shop-group{margin-bottom:12px}
.shop-title{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.shop-title .s-dot{width:8px;height:8px;border-radius:50%}
.shop-item{
  display:flex;align-items:center;gap:8px;
  font-size:13px;padding:3px 0;color:var(--ink);
}
.shop-item .si-name{flex:1}
.shop-item .si-cnt{color:var(--ink-3);font-size:11px}
.shop-item .si-have{font-size:10px;color:var(--c-veg);font-weight:700;background:var(--c-veg-soft);padding:1px 6px;border-radius:4px}
.shop-item .si-clear{color:var(--ink-3);cursor:pointer}

/* ===== 常吃菜表单 ===== */
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.form-row input,.form-row select,.form-row textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);
  background:#fff;outline:none;
}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--brand)}
.form-row textarea{resize:vertical;min-height:70px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

/* ===== 通用弹窗小按钮 ===== */
.mm-foot .btn-solid:disabled{background:#C9BBA6;cursor:not-allowed}
.modal-sm .mm-body{max-height:60vh;overflow-y:auto}
.mm-sec{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;font-size:13px;color:var(--ink-2);
}
.mm-sec .link{color:var(--accent);font-weight:700;cursor:pointer}

/* ===== 响应式 ===== */
@media (max-width:1100px){
  .layout{grid-template-columns:1fr;padding-bottom:88px}
  .cart-panel{display:none}
  .m-cart-bar{display:flex}
}
@media (max-width:640px){
  .app-head{padding:14px 14px 0}
  .head-inner{gap:10px}
  .brand h1{font-size:20px}
  .search{min-width:0;flex:1;order:3;width:100%}
  .layout{padding:14px 14px 90px}
  .dish-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .dish-card{padding:10px 11px}
  .dish-name{font-size:14px}
  .search input{font-size:16px}
  .menu-head h2{font-size:18px}
  .toast{bottom:74px}
  .cat-row{display:block;padding:0 14px 10px}
  .cat-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible;margin-bottom:6px}
  .cat-tab{justify-content:center;padding:6px 2px;gap:3px;font-size:12px}
  .cat-tab .cnt{line-height:15px;padding:0 4px}
  .cat-extra{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .cat-btn{justify-content:center;padding:7px 4px}
}
</style>
</head>
<body>

<header class="app-head">
  <div class="head-inner">
    <div class="brand">
      <span class="brand-mark">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3EEE2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c2.5 0 3.5-1.2 3.5-3 0-1-.5-1.7-1.5-2-1-.3-1.5-1-1.5-2 0-1.8 1-3 3.5-3"/><path d="M8 10c1.2-.8 2.8-1.3 4.5-1.3 3.4 0 6 1.8 6 4.3 0 1.6-1 3-2.7 3.7"/><path d="M12 8V5"/><path d="M14 5h-4"/></svg>
      </span>
      <div>
        <h1>在家吃什么</h1>
        <p>家常菜点单 · 221 道菜任你选</p>
      </div>
    </div>
    <div class="head-tools">
      <div class="people-pick">
        <span>人数</span>
        <button class="pp-btn" id="peopleMinus" aria-label="减少人数">−</button>
        <b id="peopleNum">4</b>
        <button class="pp-btn" id="peoplePlus" aria-label="增加人数">+</button>
      </div>
      <button class="btn-shuffle" id="btnShuffle">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        今天吃什么
      </button>
      <button class="btn-shuffle btn-shuffle2" id="btnWheel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
        转盘抽
      </button>
      <button class="btn-shuffle btn-shuffle2" id="btnVote">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        家庭投票
      </button>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="搜菜名，如：红烧肉">
      </label>
    </div>
  </div>
  <div class="cat-row">
    <nav class="cat-bar" id="catBar"></nav>
    <div class="cat-extra">
      <button class="cat-btn" id="btnAddDish">+ 常吃菜</button>
      <button class="cat-btn" id="btnEaten">本周已吃</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="menu-area">
    <div class="menu-head">
      <h2 id="catTitle">全部菜品</h2>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="dish-grid" id="dishGrid"></div>
  </section>

  <aside class="cart-panel" id="cartPanel">
    <div class="cart-head">
      <div>
        <h2>点菜单</h2>
        <div class="cart-info" id="cartInfo">0 道菜</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn-clear" id="cartHistory">历史</button>
        <button class="btn-clear" id="cartClear">清空</button>
      </div>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <div class="cart-total">已点 <b id="cartCount">0</b> 道菜</div>
      <button class="btn-menu" id="btnMenu" disabled>生成点菜单</button>
    </div>
  </aside>
</main>

<!-- 移动端点菜栏 -->
<div class="m-cart-bar" id="mCartBar">
  <div class="mc-summary" id="mcSummary">
    <span class="mc-badge" id="mcBadge">0</span>
    <div class="mc-text"><b>点菜单</b><br><span id="mcCount">还没点菜</span></div>
  </div>
  <button class="mc-btn" id="mcBtn">生成点菜单</button>
</div>
<div class="mc-cover" id="mcCover"></div>
<div class="m-cart-sheet" id="mcSheet">
  <div class="mc-sheet-head">
    <h3>点菜单</h3>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="mc-close" id="mcHistory" style="border:1px solid var(--line);border-radius:999px;padding:0 12px;font-size:12px;color:var(--ink-2);width:auto;height:30px;background:var(--paper)">历史</button>
      <button class="mc-close" id="mcClear" style="border:1px solid var(--line);border-radius:999px;padding:0 12px;font-size:12px;color:var(--ink-2);width:auto;height:30px;background:var(--paper)">清空</button>
      <button class="mc-close" id="mcClose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <div class="mc-sheet-body" id="mcSheetBody"></div>
  <div class="mc-sheet-foot">
    <div class="cart-total">已点 <b id="mcCount2">0</b> 道菜</div>
    <button class="btn-menu" id="mcBtn2">生成点菜单</button>
  </div>
</div>

<!-- 随机推荐 Toast -->
<div class="toast" id="toast">
  <span>今天吃这个</span>
  <span class="t-name" id="toastName"></span>
  <button class="t-act" id="toastAdd">加入清单</button>
</div>

<!-- 点菜单弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="menuModal">
    <div class="mm-head">
      <div>
        <h3>点菜单</h3>
        <div class="mm-sub" id="mmMeta"></div>
      </div>
      <button class="mm-close" id="mmClose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body" id="mmBody"></div>
    <div class="mm-foot">
      <button class="btn-ghost" id="mmShop">购物清单</button>
      <button class="btn-ghost" id="mmPrint">打印</button>
      <button class="btn-solid" id="mmCopy">复制点菜单</button>
    </div>
  </div>
</div>

<!-- 菜品详情弹窗 -->
<div class="modal-mask" id="detailMask" hidden>
  <div class="modal modal-sm">
    <div class="mm-head">
      <div>
        <h3 id="dtTitle">菜品详情</h3>
        <div class="mm-sub" id="dtSub"></div>
      </div>
      <button class="mm-close" data-close="detailMask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body" id="dtBody"></div>
    <div class="mm-foot">
      <button class="btn-ghost" data-close="detailMask">关闭</button>
      <button class="btn-solid" id="dtAdd">加入点菜单</button>
    </div>
  </div>
</div>

<!-- 转盘弹窗 -->
<div class="modal-mask" id="wheelMask" hidden>
  <div class="modal">
    <div class="mm-head">
      <div>
        <h3>转盘抽菜</h3>
        <div class="mm-sub" id="wheelMeta"></div>
      </div>
      <button class="mm-close" data-close="wheelMask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body">
      <div class="wheel-box">
        <div class="wheel-wrap">
          <div class="wheel" id="wheelDisc"></div>
          <div class="wheel-pin"></div>
          <div class="wheel-center">GO</div>
        </div>
        <div class="wheel-pool" id="wheelPool"></div>
        <div class="wheel-ctrl">
          <button class="btn-mini" id="wheelAgain">重转</button>
          <button class="btn-solid" id="wheelAdd" style="padding:9px 22px">加入点菜单</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 家庭投票弹窗 -->
<div class="modal-mask" id="voteMask" hidden>
  <div class="modal">
    <div class="mm-head">
      <div>
        <h3>家庭投票点菜</h3>
        <div class="mm-sub" id="voteStep"></div>
      </div>
      <button class="mm-close" data-close="voteMask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body" id="voteBody"></div>
    <div class="mm-foot" id="voteFoot"></div>
  </div>
</div>

<!-- 历史记录弹窗 -->
<div class="modal-mask" id="historyMask" hidden>
  <div class="modal modal-sm">
    <div class="mm-head">
      <div>
        <h3>点菜单历史</h3>
        <div class="mm-sub" id="historyMeta"></div>
      </div>
      <button class="mm-close" data-close="historyMask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body" id="historyBody"></div>
    <div class="mm-foot">
      <button class="btn-ghost" data-close="historyMask">关闭</button>
      <button class="btn-solid" id="historyClear">清空历史</button>
    </div>
  </div>
</div>

<!-- 本周已吃弹窗 -->
<div class="modal-mask" id="eatenMask" hidden>
  <div class="modal modal-sm">
    <div class="mm-head">
      <div>
        <h3>本周已吃</h3>
        <div class="mm-sub">最近3天吃过的菜，随机时会自动避开</div>
      </div>
      <button class="mm-close" data-close="eatenMask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body" id="eatenBody"></div>
    <div class="mm-foot">
      <button class="btn-ghost" id="eatenAddBtn">手动记一道</button>
      <button class="btn-solid" id="eatenClear">清空本周</button>
    </div>
  </div>
</div>

<!-- 常吃菜表单弹窗 -->
<div class="modal-mask" id="addMask" hidden>
  <div class="modal modal-sm">
    <div class="mm-head">
      <div>
        <h3 id="addTitle">录入常吃的菜</h3>
        <div class="mm-sub">加入后可在对应分类中直接点选</div>
      </div>
      <button class="mm-close" data-close="addMask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body" id="addBody">
      <div class="form-row">
        <label>菜名（必填）</label>
        <input type="text" id="addName" placeholder="如：饺子、鸡蛋面">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>分类</label>
          <select id="addCat">
            <option value="staple">主食类</option>
            <option value="pork">猪肉类</option>
            <option value="poultry">禽类</option>
            <option value="beef">牛肉类</option>
            <option value="veg">蔬菜类</option>
            <option value="tofu">豆制品类</option>
            <option value="egg">蛋类</option>
          </select>
        </div>
        <div class="form-row">
          <label>用时</label>
          <select id="addTime">
            <option value="quick">快手菜</option>
            <option value="slow">费时菜</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>食材（用顿号或逗号分隔，如：面粉 300克、猪肉馅 200克）</label>
        <textarea id="addIng" placeholder="面粉 300克、猪肉馅 200克、葱姜末 适量"></textarea>
      </div>
      <div class="form-row">
        <label>做法步骤（每行一步）</label>
        <textarea id="addSteps" placeholder="1. 和面擀皮&#10;2. 调馅&#10;3. 包饺子下锅煮"></textarea>
      </div>
    </div>
    <div class="mm-foot">
      <button class="btn-ghost" data-close="addMask">取消</button>
      <button class="btn-solid" id="addSave">保存</button>
    </div>
  </div>
</div>

<!-- 购物清单弹窗 -->
<div class="modal-mask" id="shopMask" hidden>
  <div class="modal modal-sm">
    <div class="mm-head">
      <div>
        <h3>购物清单</h3>
        <div class="mm-sub" id="shopMeta"></div>
      </div>
      <button class="mm-close" data-close="shopMask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="mm-body" id="shopBody"></div>
    <div class="mm-foot">
      <button class="btn-ghost" data-close="shopMask">关闭</button>
      <button class="btn-solid" id="shopCopy">复制清单</button>

/* ===== 本地存储 ===== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function fmtDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function myDishes(){ return LS.get('my_dishes', []); }
function setMyDishes(v){ LS.set('my_dishes', v); }
function hiddenDishes(){ return LS.get('hidden_dishes', []); }
function eatHistory(){ return LS.get('eat_history', []); }
function orderHistory(){ return LS.get('order_history', []); }

/* ===== 状态 ===== */
const state = { cat:'all', query:'', people:4, cart:{}, filters:{type:'',time:'',size:'',have:[],haveOnly:false}, vote:null, wheel:null };
const $ = id => document.getElementById(id);
let ECATS = [];
let CAT_MAP = {};
function catOf(id){ return ECATS.find(c => c.id === id); }

/* ===== 动态分类（基础6类 + 主食类 + 自定义菜） ===== */
function effectiveCats(){
  const cats = CATS.map(c => ({ id:c.id, name:c.name, items:c.items.slice() }));
  const my = myDishes();
  const hidden = hiddenDishes();
  const staples = STAPLES.filter(s => hidden.indexOf(s.name) === -1);
  staples.forEach(s => { RECIPES[s.name] = { ing:s.ing, steps:s.steps }; });
  const stapleItems = staples.map(s => s.name);
  my.forEach(m => {
    if(hidden.indexOf(m.name) > -1) return;
    RECIPES[m.name] = { ing:m.ing, steps:m.steps };
    if(m.cat === 'staple'){ if(stapleItems.indexOf(m.name) === -1) stapleItems.push(m.name); }
    else{
      const c = cats.find(c => c.id === m.cat);
      if(c) c.items.push(m.name);
    }
  });
  cats.push({ id:'staple', name:'主食类', items:stapleItems });
  return cats;
}
function buildCats(){
  ECATS = effectiveCats();
  const m = {};
  ECATS.forEach(c => c.items.forEach(n => { m[n] = c.id; }));
  CAT_MAP = m;
}

/* ===== 筛选规则 ===== */
function dishType(d){
  if(d.cat === 'staple') return '主食';
  if(d.cat === 'veg' || d.cat === 'tofu') return '素';
  if(/\汤/.test(d.name)) return '汤';
  return '荤';
}
function isQuick(d){
  const n = d.name;
  if(/蛋花汤|蒸蛋|蒸水蛋/.test(n)) return true;
  if(/汤|炖|焖|卤|扣|煲|酱牛|酱肘|烤|红烧|蒸|粉蒸|梅菜|肘子|狮子头|叉烧|锅包|炸酥|白切|口水|盐焗|豉油|姜母|啤酒|大盘|卤肉/.test(n)) return false;
  return true;
}
function dishSize(d){
  const n = d.name;
  if(dishType(d) === '汤') return 'multi';
  if(/炖|焖|煲|卤|扣|狮子头|肘子|整鸡|烤鸭|大盘|牛腩|烧肉|叉烧|酱牛|白切|盐焗|豉油|姜母|猪蹄|猪肚|酥肉|锅包|粉蒸|梅菜/.test(n)) return 'multi';
  return 'small';
}
function haveMatch(name){
  const r = RECIPES[name];
  if(!r || !state.filters.have.length) return false;
  return state.filters.have.some(h => r.ing.some(it => {
    const base = it.split(/[\s、，,]/)[0];
    return (base.indexOf(h) > -1) || (h.indexOf(base) > -1);
  }));
}

/* ===== 分类栏 ===== */
function renderCats(){
  const allCnt = ECATS.reduce((s,c) => s + c.items.length, 0);
  let html = '<button class="cat-tab' + (state.cat==='all'?' active':'') + '" data-cat="all"><span class="dot" style="background:var(--ink-3)"></span>全部<span class="cnt">' + allCnt + '</span></button>';
  ECATS.forEach(c => {
    const col = c.id === 'staple' ? 'egg' : c.id;
    html += '<button class="cat-tab' + (state.cat===c.id?' active':'') + '" data-cat="' + c.id + '"><span class="dot" style="background:var(--c-' + col + ')"></span>' + c.name + '<span class="cnt">' + c.items.length + '</span></button>';
  });
  $('catBar').innerHTML = html;
}

/* ===== 菜品网格 ===== */
function visibleDishes(){
  const src = state.cat==='all'
    ? ECATS.flatMap(c => c.items.map(n => ({name:n, cat:c.id})))
    : catOf(state.cat).items.map(n => ({name:n, cat:state.cat}));
  let list = src;
  if(state.filters.type) list = list.filter(d => dishType(d) === state.filters.type);
  if(state.filters.time) list = list.filter(d => { const q = isQuick(d); return state.filters.time==='quick' ? q : !q; });
  if(state.filters.size) list = list.filter(d => dishSize(d) === state.filters.size);
  if(state.filters.have.length && state.filters.haveOnly) list = list.filter(d => haveMatch(d.name));
  if(!state.query) return list;
  return list.filter(d => d.name.indexOf(state.query) > -1);
}
function renderDishes(){
  const list = visibleDishes();
  $('catTitle').textContent = state.query ? '搜索：' + state.query : (state.cat==='all' ? '全部菜品' : catOf(state.cat).name);
  $('resultCount').textContent = list.length + ' 道';
  const grid = $('dishGrid');
  if(!list.length){
    grid.innerHTML = '<div class="menu-empty"><div class="big">没有符合条件的菜</div>换个筛选或搜别的菜名试试，比如：红烧肉、番茄炒蛋</div>';
    return;
  }
  const cards = list.map(d => {
    const qty = state.cart[d.name] || 0;
    const t = dishType(d);
    const quick = isQuick(d);
    const ok = state.filters.have.length && haveMatch(d.name);
    const col = d.cat === 'staple' ? 'egg' : d.cat;
    const hasRecipe = !!RECIPES[d.name];
    return '<button class="dish-card' + (qty?' added':'') + '" data-name="' + d.name + '" data-cat="' + d.cat + '" style="--cat:var(--c-' + col + ');--cat-soft:var(--c-' + col + '-soft)">'
      + '<span class="dish-tag-flag">' + (quick?'快':'慢') + ' · ' + t + '</span>'
      + '<span class="dish-name">' + d.name + '</span>'
      + '<span class="dish-actions">'
      + (hasRecipe ? '<span class="dish-view" data-act="view" data-name="' + d.name + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-5 0-9 3-9 7s4 7 9 7 9-3 9-7-4-7-9-7z"/><circle cx="12" cy="12" r="3"/></svg></span>' : '')
      + '<span class="dish-add" data-act="add" data-name="' + d.name + '"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>'
      + '</span>'
      + (qty ? '<span class="dish-qty">' + qty + '</span>' : '')
      + (ok ? '<span class="dish-ok">有食材</span>' : '')
      + '</button>';
  });
  const gridW = grid.clientWidth || 900;
  const cols = gridW < 520 ? 2 : Math.max(2, Math.floor((gridW + 10) / 180));
  if(cards.length % cols === 1){
    const li = cards.length - 1;
    cards[li] = cards[li].replace('class="dish-card', 'class="dish-card last-single');
  }
  grid.innerHTML = cards.join('');
}

/* ===== 购物车操作 ===== */
function addDish(name){
  state.cart[name] = (state.cart[name]||0) + 1;
  renderDishes(); renderCart();
}
function changeQty(name, delta){
  const v = (state.cart[name]||0) + delta;
  if(v <= 0) delete state.cart[name];
  else state.cart[name] = v;
  renderDishes(); renderCart();
}
function clearCart(){
  state.cart = {};
  renderDishes(); renderCart();
}

/* ===== Toast ===== */
let toastTimer = null;
function showToast(msg, withAdd){
  $('toastAdd').style.display = withAdd ? '' : 'none';
  $('toastName').textContent = msg;
  const t = $('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ===== 随机推荐（排除最近3天已吃） ===== */
function getExcluded(){
  const days = {};
  for(let i = 0; i < 3; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    days[fmtDate(d)] = true;
  }
  const ex = new Set();
  eatHistory().forEach(r => { if(days[r.date]) r.dishes.forEach(n => ex.add(n)); });
  return ex;
}
function shufflePick(){
  const pool = visibleDishes();
  if(!pool.length){ showToast('没有符合条件的菜，先放宽筛选', false); return; }
  const ex = getExcluded();
  let cands = pool.filter(d => !ex.has(d.name));
  if(!cands.length){
    cands = pool;
    showToast('最近3天都吃过了，不排除再来一次', false);
  }
  const d = cands[Math.floor(Math.random() * cands.length)];
  $('toastAdd').onclick = () => { addDish(d.name); $('toast').classList.remove('show'); };
  showToast(d.name, true);
}

/* ===== 点菜单文本 ===== */
function dateStr(){
  return new Date().toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric'});
}
function menuText(){
  const lines = ['【在家吃什么 · 点菜单】', '日期：' + dateStr() + '　人数：' + state.people + ' 人', ''];
  ECATS.forEach(c => {
    const names = c.items.filter(n => state.cart[n]);
    if(!names.length) return;
    lines.push(c.name + '（' + names.reduce((s,n) => s + state.cart[n], 0) + ' 份）');
    names.forEach(n => lines.push('　' + n + ' ×' + state.cart[n]));
  });
  const total = Object.keys(state.cart).reduce((s,n) => s + state.cart[n], 0);
  lines.push('');
  lines.push('合计 ' + total + ' 份 · ' + Object.keys(state.cart).length + ' 道菜');
  return lines.join('\n');
}

function openModal(){
  if(!Object.keys(state.cart).length) return;
  closeSheet();
  renderModal();
  saveOrderHistory();
  $('modalMask').hidden = false;
}

function closeModalId(id){ document.getElementById(id).hidden = true; }
function copyMenu(){
  const txt = menuText();
  const done = () => { closeModal(); showToast('点菜单已复制', false); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ closeModal(); }
  document.body.removeChild(ta);
}

/* ===== 转盘抽 ===== */
let wheelItems = [], wheelPick = null, wheelBase = 0, wheelTimer = null;
function openWheel(){
  const pool = visibleDishes();
  if(!pool.length){ showToast('没有符合条件的菜，先放宽筛选', false); return; }
  const ex = getExcluded();
  const exNote = pool.filter(d => ex.has(d.name)).length ? '（已避开最近3天吃过的）' : '';
  let cands = pool.filter(d => !ex.has(d.name));
  cands.sort(() => Math.random() - 0.5);
  if(cands.length > 12) cands = cands.slice(0, 12);
  wheelItems = cands.map(d => d.name);
  wheelPick = null;
  wheelBase = 0;
  drawWheel();
  $('wheelMeta').textContent = '候选 ' + cands.length + ' 道' + exNote;
  $('wheelPool').textContent = '候选：' + (cands.length ? cands.map(d => d.name).join('、') : '无');
  $('wheelMask').hidden = false;
}
function drawWheel(){
  const disc = $('wheelDisc');
  const n = wheelItems.length;
  if(!n) return;
  const colors = ['#D2533C','#E09B2D','#8C3F26','#4C7A52','#A07A3C','#E3A72F','#B3543B','#C9802B','#3E6251','#D98E5F','#7A9A6A','#B8A03C'];
  const stops = [];
  for(let i = 0; i < n; i++){
    const from = i*360/n, to = (i+1)*360/n;
    stops.push(colors[i % colors.length] + ' ' + from + 'deg ' + to + 'deg');
  }
  disc.style.background = 'conic-gradient(' + stops.join(',') + ')';
  disc.style.transform = 'rotate(' + wheelBase + 'deg)';
  disc.innerHTML = '';
  for(let i = 0; i < n; i++){
    const label = document.createElement('span');
    label.className = 'wheel-label';
    const ang = i*360/n + 360/n/2;
    const txt = wheelItems[i];
    label.textContent = txt.length > 4 ? txt.slice(0, 4) : txt;
    label.style.transform = 'rotate(' + ang + 'deg) translate(90px) rotate(' + (-ang) + 'deg)';
    label.style.transformOrigin = '0 0';
    disc.appendChild(label);
  }
}
function spinWheel(){
  if(!wheelItems.length) return;
  const disc = $('wheelDisc');
  disc.style.transition = 'none';
  disc.style.transform = 'rotate(' + wheelBase + 'deg)';
  void disc.offsetWidth;
  const n = wheelItems.length;
  const idx = Math.floor(Math.random() * n);
  wheelPick = wheelItems[idx];
  const seg = 360 / n;
  const target = (360 - (idx * seg + seg / 2)) % 360;
  const cur = ((wheelBase % 360) + 360) % 360;
  wheelBase = wheelBase + 360 * 5 + ((target - cur) % 360 + 360) % 360;
  disc.style.transition = '';
  disc.style.transform = 'rotate(' + wheelBase + 'deg)';
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    $('wheelMeta').textContent = '抽中：' + wheelPick;
    showToast('转盘抽中：' + wheelPick, false);
  }, 4200);
}

let voteState = null;
function openVote(){
  if(visibleDishes().length < 2){ showToast('候选菜太少，先放宽筛选', false); return; }
  voteState = { names:['家人1','家人2','家人3','家人4'], picks:{}, force:false };

function renderVoteSetup(){
  $('voteStep').textContent = '第一步：设置成员';
  $('voteBody').innerHTML =
    '<div class="form-row"><label>家庭成员（逗号分隔，2-8人）</label>'
    + '<input type="text" id="voteNames" value="' + voteState.names.join(',') + '"></div>'

  $('voteFoot').innerHTML = '<button class="btn-ghost" data-close="voteMask">取消</button><button class="btn-solid" id="voteStart">开始投票</button>';

    voteState.force = false;
    renderVotePick();

function renderVotePick(){
  const idx = voteState.names.findIndex(n => !voteState.picks[n]);
  if(idx === -1){ renderVoteResult(); return; }
  $('voteStep').textContent = '第 ' + (idx + 1) + ' / ' + voteState.names.length + ' 位';
  $('voteBody').innerHTML =
    '<div class="vote-name-list">' + voteState.names.map((n,i) => '<span class="vote-name-tag' + (voteState.picks[n] ? ' done' : '') + '">' + n + (voteState.picks[n] ? ' · ' + voteState.picks[n] : '') + '</span>').join('') + '</div>'
    + '<div class="vote-now">轮到 <b>' + voteState.names[idx] + '</b> 选菜</div>'
    + '<div class="vote-pick-grid" id="votePickGrid"></div>';
  const pool = visibleDishes();
  const ex = getExcluded();
  const cands = voteState.force ? pool : pool.filter(d => !ex.has(d.name));
  const grid = $('votePickGrid');
  if(!cands.length){
    grid.innerHTML = '<div class="menu-empty" style="grid-column:1/-1;padding:16px 0">最近3天都吃过了<button class="chip active" id="voteIgnore" style="margin-left:8px">仍从全部候选里选</button></div>';
    $('voteIgnore').onclick = () => { voteState.force = true; renderVotePick(); };
  } else {
    grid.innerHTML = cands.map(d => '<button class="vote-pick" data-vpick="' + d.name + '">' + d.name + '</button>').join('');
  }
  $('voteFoot').innerHTML = '<button class="btn-ghost" id="voteBack">上一位</button><button class="btn-solid" id="voteRandom">帮他随机选</button>';
  $('voteRandom').onclick = () => {
    const pool2 = visibleDishes();
    const d = pool2[Math.floor(Math.random() * pool2.length)];
    voteState.picks[voteState.names[idx]] = d.name;
    renderVotePick();
  };
  $('voteBack').onclick = () => {
    if(idx > 0){ delete voteState.picks[voteState.names[idx-1]]; renderVotePick(); }
  };
}
function renderVoteResult(){
  $('voteStep').textContent = '投票完成';
  const counts = {};
  voteState.names.forEach(n => { const p = voteState.picks[n]; if(p) counts[p] = (counts[p]||0) + 1; });
  const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  const max = entries[0][1];
  const winners = entries.filter(e => e[1] === max).map(e => e[0]);
  $('voteBody').innerHTML =
    '<div class="vote-result">' + entries.map(e =>
      '<div class="vote-result-item"><span class="v-name">' + e[0] + '</span><span class="v-bar"><i style="width:' + Math.round(e[1]/max*100) + '%"></i></span><span class="v-num">' + e[1] + '</span></div>').join('') + '</div>'
    + (winners.length === 1
      ? '<div class="vote-winner">获胜：<b>' + winners[0] + '</b>（' + max + ' 票）</div>'
      : '<div class="vote-winner">并列最高（' + max + ' 票）：<b>' + winners.join('、') + '</b></div>')
    + '<div class="mm-sec"><span class="link" id="voteEat">记入本周已吃</span></div>';
  $('voteFoot').innerHTML =
    '<button class="btn-ghost" id="voteReplay">重新投</button>'
    + '<button class="btn-solid" id="voteTakeMajority">取最高票' + (winners.length > 1 ? '（随机）' : '') + '</button>'
    + '<button class="btn-solid" id="voteTakeRandom">随机抽一个</button>';
  $('voteTakeMajority').onclick = () => { const w = winners[Math.floor(Math.random() * winners.length)]; addDish(w); closeModalId('voteMask'); showToast('已加入：' + w, false); };
  $('voteTakeRandom').onclick = () => { const all = entries.map(e => e[0]); const w = all[Math.floor(Math.random() * all.length)]; addDish(w); closeModalId('voteMask'); showToast('已加入：' + w, false); };
  $('voteReplay').onclick = () => { voteState.picks = {}; voteState.force = false; renderVoteSetup(); };
  $('voteEat').onclick = () => { eatRecord(Object.keys(counts)); showToast('已记入本周已吃', false); };
}

function isCondiment(s){
  return /生抽|老抽|酱油|盐|糖|冰糖|淀粉|料酒|醋|陈醋|白醋|香油|麻油|蚝油|豆瓣酱|甜面酱|黄豆酱|豆豉|胡椒|花椒|辣椒粉|辣椒油|八角|桂皮|香叶|蜂蜜|味精|鸡精|油 |白芝麻|孜然|五香粉|番茄酱|叉烧酱|腌料|蒸鱼豉油|黄酒|米酒|奥尔良/.test(s);
}
function openShop(){
  const names = Object.keys(state.cart);
  if(!names.length){ showToast('点菜单为空', false); return; }
  const main = {}, cond = {};
  names.forEach(n => {
    const r = RECIPES[n];
    if(!r) return;
    r.ing.forEach(it => {
      it.split(/[、，,]/).forEach(p => {
        p = p.trim(); if(!p) return;
        const base = p.split(' ')[0].trim();
        if(isCondiment(base)) cond[base] = (cond[base]||0) + 1;
        else main[base] = (main[base]||0) + 1;
      });
    });
  });
  const have = state.filters.have;
  $('shopMeta').textContent = names.length + ' 道菜 · ' + Object.keys(main).length + ' 种主食材';
  let html = '<div class="shop-group"><div class="shop-title"><span class="s-dot" style="background:var(--accent)"></span>主食材</div>';
  Object.keys(main).sort().forEach(k => {
    const isHave = have.some(h => k.indexOf(h) > -1 || h.indexOf(k) > -1);
    html += '<div class="shop-item"><span class="si-name">' + k + '</span><span class="si-cnt">' + main[k] + ' 道用到</span>' + (isHave ? '<span class="si-have">家里有</span>' : '<span class="si-clear" data-shopdel="' + k + '">×</span>') + '</div>';
  });
  html += '</div><div class="shop-group"><div class="shop-title"><span class="s-dot" style="background:var(--c-egg)"></span>调料（家里一般常备）</div>';
  Object.keys(cond).sort().forEach(k => {
    html += '<div class="shop-item"><span class="si-name">' + k + '</span><span class="si-cnt">' + cond[k] + ' 道用到</span><span class="si-clear" data-shopdel="' + k + '">×</span></div>';
  });
  html += '</div><div class="dt-note">点 × 可删掉家里已有的项；输入家里现有食材后会自动标记「家里有」。</div>';
  $('shopBody').innerHTML = html;
  $('shopMask').hidden = false;

function copyText(txt, msg){
  const done = () => showToast(msg, false);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function shopText(){
  const lines = ['【购物清单】'];
  document.querySelectorAll('#shopBody .shop-item').forEach(it => {

/* ===== 事件绑定 ===== */
document.addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if(tab){ state.cat = tab.dataset.cat; renderCats(); renderDishes(); return; }
  const tp = e.target.closest('.chip[data-type]');
  if(tp){ state.filters.type = tp.dataset.type; refreshChips(); renderDishes(); return; }
  const tm = e.target.closest('.chip[data-time]');
  if(tm){ state.filters.time = tm.dataset.time; refreshChips(); renderDishes(); return; }
  const sz = e.target.closest('.chip[data-size]');
  if(sz){ state.filters.size = sz.dataset.size; refreshChips(); renderDishes(); return; }
  const card = e.target.closest('.dish-card');
  if(card){
    const act = e.target.closest('[data-act]');
    if(act && act.dataset.act === 'view'){ openDetail(act.dataset.name); return; }
    if(act && act.dataset.act === 'add'){ addDish(act.dataset.name); return; }
    if(RECIPES[card.dataset.name]) openDetail(card.dataset.name);
    else addDish(card.dataset.name);
    return;
  }
  const ci = e.target.closest('[data-act]');
  if(ci){
    const act = ci.dataset.act, name = ci.dataset.name;
    if(act === 'plus') changeQty(name, 1);
    else if(act === 'minus') changeQty(name, -1);
    else if(act === 'del'){ delete state.cart[name]; renderDishes(); renderCart(); }
    return;
  }
  const vp = e.target.closest('[data-vpick]');
  if(vp){
    const idx = voteState.names.findIndex(n => !voteState.picks[n]);
    if(idx > -1){ voteState.picks[voteState.names[idx]] = vp.dataset.vpick; renderVotePick(); }
    return;
  }
  const delE = e.target.closest('[data-eatdel]');
  if(delE){
    const eh = eatHistory();
    const day = eh.find(r => r.date === delE.dataset.eatdel);
    if(day){
      day.dishes = day.dishes.filter(n => n !== delE.dataset.name);
      if(!day.dishes.length) eh.splice(eh.indexOf(day), 1);
      LS.set('eat_history', eh);
      renderEaten();
    }
    return;
  }
  const his = e.target.closest('[data-his]');
  if(his){
    const b = $('hbody' + his.dataset.his);
    if(b){ b.classList.toggle('open'); his.querySelector('.h-more').textContent = b.classList.contains('open') ? '▾' : '▸'; }
    return;
  }
  const hr = e.target.closest('[data-hreload]');
  if(hr){ reloadHistory(Number(hr.dataset.hreload)); return; }
  const hd2 = e.target.closest('[data-hdel]');
  if(hd2){
    const oh = orderHistory();
    oh.splice(Number(hd2.dataset.hdel), 1);
    LS.set('order_history', oh);
    renderHistory();
    return;
  }
  const sd = e.target.closest('[data-shopdel]');
  if(sd){ sd.closest('.shop-item').remove(); return; }
  const cl = e.target.closest('[data-close]');
  if(cl){ closeModalId(cl.dataset.close); return; }
  const wg2 = e.target.closest('.wheel-center');
  if(wg2){ spinWheel(); return; }
  const me = e.target.closest('#mmEat');
  if(me){ eatRecord(Object.keys(state.cart)); showToast('已记入本周已吃', false); return; }
});
$('searchInput').addEventListener('input', e => { state.query = e.target.value.trim(); renderDishes(); });
$('btnShuffle').addEventListener('click', shufflePick);
$('btnWheel').addEventListener('click', openWheel);
$('btnVote').addEventListener('click', openVote);
$('btnAddDish').addEventListener('click', openAddForm);
$('btnEaten').addEventListener('click', () => { renderEaten(); $('eatenMask').hidden = false; });
$('peopleMinus').addEventListener('click', () => { state.people = Math.max(1, state.people - 1); $('peopleNum').textContent = state.people; });
$('peoplePlus').addEventListener('click', () => { state.people = Math.min(20, state.people + 1); $('peopleNum').textContent = state.people; });
$('cartClear').addEventListener('click', () => { clearCart(); showToast('点菜单已清空', false); });
$('cartHistory').addEventListener('click', () => { renderHistory(); $('historyMask').hidden = false; });
$('btnMenu').addEventListener('click', openModal);
$('mcBtn').addEventListener('click', openModal);
$('mcBtn2').addEventListener('click', openModal);
$('mcHistory').addEventListener('click', () => { renderHistory(); closeSheet(); $('historyMask').hidden = false; });
$('mcClear').addEventListener('click', () => { clearCart(); closeSheet(); showToast('点菜单已清空', false); });
$('mmClose').addEventListener('click', closeModal);
$('modalMask').addEventListener('click', e => { if(e.target === $('modalMask')) closeModal(); });
$('mmCopy').addEventListener('click', copyMenu);
$('mmPrint').addEventListener('click', () => window.print());
$('mmShop').addEventListener('click', openShop);
$('mcSummary').addEventListener('click', openSheet);
$('mcClose').addEventListener('click', closeSheet);
$('mcCover').addEventListener('click', closeSheet);
$('historyClear').addEventListener('click', () => {
  LS.set('order_history', []);
  renderHistory();
  showToast('历史已清空', false);
});
$('eatenAddBtn').addEventListener('click', () => {
  const name = window.prompt('今天还吃了什么？（输入菜名）');
  if(name && name.trim()){ eatRecord([name.trim()]); renderEaten(); }
});
$('eatenClear').addEventListener('click', () => {
  LS.set('eat_history', []);
  renderEaten();
  showToast('本周已吃记录已清空', false);
});
$('wheelAgain').addEventListener('click', spinWheel);
$('wheelAdd').addEventListener('click', () => {
  if(!wheelPick){ showToast('先转一下盘', false); return; }
  addDish(wheelPick);
  closeModalId('wheelMask');
  showToast('已加入：' + wheelPick, false);
});
$('addSave').addEventListener('click', saveAddDish);
$('shopCopy').addEventListener('click', () => copyText(shopText(), '购物清单已复制'));

/* ===== 初始化 ===== */
buildCats();
renderCats();
renderDishes();
renderCart();
</script>
</body>
