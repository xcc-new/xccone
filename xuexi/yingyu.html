<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#4f7cff;--primary-d:#3a63dd;--primary-l:#eaf0ff;
  --accent:#ff9f43;--ok:#26c281;--ok-l:#e6f9f1;--bad:#ee5253;--bad-l:#feecec;
  --bg:#f2f5fb;--card:#fff;--text:#22304a;--muted:#8698b8;--line:#e6ecf7;
  --shadow:0 6px 20px rgba(63,94,160,.10);
  --radius:20px;
}
html{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.hidden{display:none!important}

header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:14px 16px 12px;background:rgba(242,245,251,.92);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border:none;border-radius:12px;background:#fff;
  color:var(--text);font-size:17px;cursor:pointer;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
.icon-btn:active{transform:scale(.92)}
.header-txt{flex:1;min-width:0}
.header-txt h1{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-txt p{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{flex:1;padding:4px 16px 40px}

.hero{text-align:center;padding:18px 0 22px}
.hero-emoji{font-size:46px;line-height:1;margin-bottom:10px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero h2{font-size:20px;font-weight:800;margin-bottom:6px}
.hero p{font-size:13px;color:var(--muted)}

.section-title{font-size:13px;font-weight:700;color:var(--primary);margin:18px 2px 10px;letter-spacing:.5px}
.sub-section-title{font-size:12px;font-weight:600;color:var(--muted);margin:10px 2px 6px;letter-spacing:.5px;padding-left:4px}

.unit-list{display:flex;flex-direction:column;gap:10px}
.unit-item{
  display:flex;align-items:center;gap:13px;background:#fff;border:none;border-radius:16px;
  padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;text-align:left;width:100%;
  font-family:inherit;
}
.unit-item:active{transform:scale(.98)}
.unit-badge{
  width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:var(--primary-l);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
}
.unit-info{flex:1;min-width:0}
.unit-info .t{font-size:14.5px;font-weight:700;color:var(--text)}
.unit-info .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.unit-bar{height:5px;background:#eef2fa;border-radius:3px;margin-top:7px;overflow:hidden}
.unit-bar i{display:block;height:100%;background:linear-gradient(90deg,#4facfe,#4f7cff);border-radius:3px;transition:width .4s}
.unit-arrow{color:#c7d3e8;font-size:18px;font-weight:700}

.mode-list{display:flex;flex-direction:column;gap:11px}
.mode-item{
  display:flex;align-items:center;gap:14px;background:#fff;border:none;border-radius:16px;
  padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;text-align:left;width:100%;
  font-family:inherit;
}
.mode-item:active{transform:scale(.98)}
.mode-emoji{font-size:26px;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--primary-l);display:flex;align-items:center;justify-content:center}
.mode-item:nth-child(2) .mode-emoji{background:#fff2e3}
.mode-item:nth-child(3) .mode-emoji{background:#e8f8f1}
.mode-item:nth-child(4) .mode-emoji{background:#f3ecff}
.mode-item:nth-child(5) .mode-emoji{background:#ffecec}
.mode-item:nth-child(6) .mode-emoji{background:#e2f7f3}
.mode-info{flex:1}
.mode-info .t{font-size:14.5px;font-weight:700}
.mode-info .s{font-size:11.5px;color:var(--muted);margin-top:3px}

.study-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-wrap{flex:1;height:8px;background:#e6ecf7;border-radius:4px;overflow:hidden}
.progress-wrap i{display:block;height:100%;background:linear-gradient(90deg,#43cea2,#4f7cff);border-radius:4px;transition:width .35s}
.study-count{font-size:12.5px;font-weight:700;color:var(--muted);min-width:44px;text-align:right}

.flashcard{perspective:1400px;height:290px;cursor:pointer;margin-bottom:20px}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;box-shadow:0 10px 30px rgba(63,94,160,.14);background:#fff;
}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,#f7faff,#eef4ff)}
.fc-word{font-size:40px;font-weight:800;letter-spacing:-.5px;color:var(--text);word-break:break-word;text-align:center;line-height:1.15}
.fc-phonetic{font-size:16px;color:var(--muted);margin-top:12px;font-family:"Times New Roman",serif}
.fc-zh{font-size:34px;font-weight:800;color:var(--primary);text-align:center;line-height:1.25}
.fc-word-sm{font-size:17px;color:var(--muted);margin-top:12px;font-weight:600}
.fc-hint{position:absolute;bottom:18px;font-size:11.5px;color:#b6c4dc;letter-spacing:.5px}
.speak-btn{
  margin-top:16px;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:var(--primary-l);color:var(--primary);font-size:22px;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;font-family:inherit;
}
.speak-btn:active{transform:scale(.9)}

.btn{
  border:none;border-radius:16px;padding:16px;font-size:15.5px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .15s;color:#fff;
}
.btn:active{transform:scale(.96)}
.btn-ok{background:linear-gradient(135deg,#3ddc97,#26c281);box-shadow:0 6px 18px rgba(38,194,129,.3)}
.btn-bad{background:linear-gradient(135deg,#ff7b7b,#ee5253);box-shadow:0 6px 18px rgba(238,82,83,.3)}
.btn-primary{background:linear-gradient(135deg,#6a92ff,#4f7cff);box-shadow:0 6px 18px rgba(79,124,255,.3);width:100%}
.btn-ghost{background:#fff;color:var(--text);box-shadow:var(--shadow)}

.quiz-q{text-align:center;margin-bottom:22px}
.quiz-q .label{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:10px}
.quiz-q .main{font-size:42px;font-weight:800;line-height:1.15;word-break:break-word}
.quiz-q .sub{font-size:15px;color:var(--muted);margin-top:8px}
.quiz-audio{
  width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;margin:6px auto 0;
  background:linear-gradient(135deg,#8e7bff,#5a44e0);color:#fff;font-size:38px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(110,90,224,.35);
  transition:transform .15s;font-family:inherit;
}
.quiz-audio:active{transform:scale(.92)}

.opt-list{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:16px;
  padding:15px 17px;cursor:pointer;box-shadow:var(--shadow);font-size:16px;font-weight:600;
  font-family:inherit;color:var(--text);text-align:left;transition:all .2s;
}
.opt:active{transform:scale(.985)}
.opt .k{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#eef2fa;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
}
.opt.correct{border-color:var(--ok);background:var(--ok-l)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

.spell-box{background:#fff;border-radius:22px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;margin-bottom:20px}
.spell-zh{font-size:30px;font-weight:800;color:var(--primary);margin-bottom:8px}
.spell-ph{font-size:14px;color:var(--muted);font-family:"Times New Roman",serif;margin-bottom:20px}
.spell-input{
  width:100%;border:2.5px solid var(--line);border-radius:15px;padding:15px;font-size:20px;
  text-align:center;font-family:inherit;font-weight:700;color:var(--text);outline:none;transition:.2s;
  letter-spacing:1px;
}
.spell-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,124,255,.12)}
.spell-input.correct{border-color:var(--ok);background:var(--ok-l);color:var(--ok)}
.spell-input.wrong{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.spell-answer{font-size:15px;color:var(--muted);margin-top:14px;min-height:22px}
.spell-answer b{color:var(--ok);font-size:17px}

.result-wrap{text-align:center;padding:26px 0}
.result-emoji{font-size:64px;line-height:1;margin-bottom:14px}
.result-wrap h2{font-size:22px;font-weight:800;margin-bottom:8px}
.result-wrap .sub{font-size:13.5px;color:var(--muted);margin-bottom:24px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:22px}
.rstat{background:#fff;border-radius:16px;padding:16px 8px;box-shadow:var(--shadow)}
.rstat .n{font-size:24px;font-weight:800;line-height:1}
.rstat .l{font-size:11px;color:var(--muted);margin-top:6px}
.rstat.ok .n{color:var(--ok)}
.rstat.bad .n{color:var(--bad)}
.rstat.acc .n{color:var(--primary)}
.wrong-list{text-align:left;background:#fff;border-radius:18px;padding:6px 16px;box-shadow:var(--shadow);margin-bottom:20px;max-height:220px;overflow:auto}
.wrong-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.wrong-item:last-child{border-bottom:none}
.wrong-item .en{font-size:15px;font-weight:700}
.wrong-item .zh{font-size:13px;color:var(--muted)}
.wrong-item .spk{border:none;background:var(--primary-l);color:var(--primary);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:14px;flex:0 0 32px}

.lesson-overlay{
  position:fixed;inset:0;background:rgba(34,48,74,.6);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .25s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.lesson-overlay.show{opacity:1;pointer-events:auto}
.lesson-modal{
  background:#fff;border-radius:24px;width:100%;max-width:520px;
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(34,48,74,.3);
  transform:scale(.95);transition:transform .25s;
}
.lesson-overlay.show .lesson-modal{transform:scale(1)}
.lesson-header{
  padding:18px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;
}
.lesson-header h3{font-size:16px;font-weight:800}
.lesson-close{
  width:32px;height:32px;border:none;border-radius:10px;background:#f2f5fb;
  color:var(--muted);font-size:16px;cursor:pointer;font-family:inherit;
}
.lesson-body{padding:16px 20px;overflow-y:auto;flex:1}
.lesson-line{
  display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);
}
.lesson-line:last-child{border-bottom:none}
.lesson-line .who{
  flex:0 0 auto;font-size:12px;font-weight:800;color:var(--primary);
  background:var(--primary-l);padding:3px 8px;border-radius:8px;height:fit-content;min-width:52px;text-align:center;
}
.lesson-line .say{flex:1}
.lesson-line .en{font-size:15px;font-weight:600;color:var(--text);line-height:1.4}
.lesson-line .zh{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.lesson-speak{
  border:none;background:var(--primary-l);color:var(--primary);width:28px;height:28px;
  border-radius:9px;cursor:pointer;font-size:13px;flex:0 0 28px;font-family:inherit;
}

.toast{
  position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-16px);
  background:rgba(34,48,74,.94);color:#fff;padding:11px 20px;border-radius:14px;font-size:13.5px;
  font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:.28s;backdrop-filter:blur(8px);
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}

@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.fade-in{animation:pop .3s ease}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="backBtn" class="icon-btn hidden" aria-label="返回">←</button>
    <div class="header-txt">
      <h1 id="hTitle">五年级上册 · 人教PEP版</h1>
      <p id="hSub">选择单元开始学习</p>
    </div>
    <button id="homeBtn" class="icon-btn" aria-label="首页">🏠</button>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<div class="lesson-overlay" id="lessonOverlay">
  <div class="lesson-modal">
    <div class="lesson-header">
      <h3 id="lessonTitle">课文原文</h3>
      <button class="lesson-close" data-action="close-lesson">✕</button>
    </div>
    <div class="lesson-body" id="lessonBody"></div>
  </div>
</div>

const STORE_KEY = 'pep_words_v3';
let STORE = (() => {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        if (!parsed.cards) parsed.cards = {};
        if (!parsed.daily) parsed.daily = {};
        if (typeof parsed.streak !== 'number') parsed.streak = 0;
        if (!parsed.lastDay) parsed.lastDay = '';
        return parsed;
      }
    }
  } catch(e) {}
  return {cards:{}, daily:{}, streak:0, lastDay:''};
})();
function persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); } catch(e){} }

const state = {
  view: 'home', grade: 5, sem: '上', unit: null, mode: null,
  queue: [], idx: 0, flipped: false, options: null, answered: false,
  picked: null, stats: {right:0, wrong:0}, wrongWords: [], extraDone: {},
  spellingValue: '', lessonOpen: false
};

/* =========================================================
   工具函数
   ========================================================= */
const $ = id => document.getElementById(id);
const main = $('main');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg, ms=1600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),ms); }
function getWords(g,s,u){ const raw = WORD_DATA[`${g}${s}`]?.[u]; if(!raw) return []; return raw.map(a=>({en:a[0],zh:a[1],ph:a[2]||''})); }
function cardId(g,s,u,en){ return `${g}${s}${u}::${en}`; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function countWords(g){ let n=0; for(const s of ['上','下']) for(const u in (WORD_DATA[`${g}${s}`]||{})) n += WORD_DATA[`${g}${s}`][u].length; return n; }
function unitTotal(g,s,u){ return (WORD_DATA[`${g}${s}`]?.[u]||[]).length; }
function isMastered(id){ const c = STORE.cards[id]; return !!(c && c.interval >= 6); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }

/* =========================================================
   语音朗读（在线 TTS + 系统 TTS 自动兜底）
   在线音源：有道词典 TTS（免费、无 Key、音质接近真人）
   ========================================================= */
let currentAudio = null;

function speak(text, rate){
  if(!text) return;

  // 停止上一段音频
  if(currentAudio){
    try { currentAudio.pause(); } catch(e){}
    currentAudio = null;
  }
  if('speechSynthesis' in window) speechSynthesis.cancel();

  // 有道 TTS：type=2 美音，type=1 英音
  const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`;
  const audio = new Audio(url);
  audio.preload = 'auto';
  currentAudio = audio;

  let fallbackUsed = false;
  const fallback = () => {
    if(fallbackUsed) return;
    fallbackUsed = true;
    console.warn('在线 TTS 失败，回退到系统语音');
    systemSpeak(text, rate);
  };

  audio.onerror = fallback;
  // 5 秒还没开始播放就回退
  const timer = setTimeout(fallback, 5000);
  audio.onplaying = () => clearTimeout(timer);
  audio.onended = () => clearTimeout(timer);

  audio.play().catch(e => {
    clearTimeout(timer);
    console.warn('在线 TTS 播放失败:', e.message);
    fallback();
  });
}

/* 系统 TTS 兜底（离线或在线失败时使用） */
function systemSpeak(text, rate){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音朗读'); return; }

  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  rate = rate || (isMobile ? 0.55 : 0.8);
  const pitch = isMobile ? 0.95 : 1.03;

  const voices = speechSynthesis.getVoices();
  const preferred = [
    /Google US English/i,
    /Samantha/i,
    /Microsoft Aria/i,
    /Microsoft Zira/i,
    /en-US/i,
    /en-GB/i,
    /^en/i
  ];
  let voice = null;
  for (const p of preferred) {
    voice = voices.find(v => p.test(v.name) || p.test(v.lang));
    if (voice) break;
  }

  speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'en-US';
    u.rate = rate;
    u.pitch = pitch;
    u.volume = 1;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }, 100);
}

/* =========================================================
   SM-2 间隔重复算法
   ========================================================= */
function updateCardSM2(id, quality){
  const c = STORE.cards[id] || {interval:0, repetition:0, efactor:2.5, due:null, right:0, wrong:0};
  if(quality < 3){
    c.repetition = 0; c.interval = 0; c.wrong = (c.wrong||0)+1;
    c.due = new Date(Date.now() + 5*60*1000).toISOString();
  } else {
    if(c.repetition === 0) c.interval = 1;
    else if(c.repetition === 1) c.interval = 6;
    else c.interval = Math.max(1, Math.round(c.interval * c.efactor));
    c.repetition = (c.repetition||0)+1; c.right = (c.right||0)+1;
    const d = new Date(); d.setDate(d.getDate() + c.interval); c.due = d.toISOString();
  }
  c.efactor = Math.max(1.3, (c.efactor||2.5) + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  c.lastQuality = quality; c.updatedAt = Date.now();
  STORE.cards[id] = c; persist();
}

function recordDaily(){
  const k = todayKey();
  STORE.daily[k] = (STORE.daily[k]||0)+1;
  if(STORE.lastDay !== k){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yk = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
    STORE.streak = (STORE.lastDay === yk) ? (STORE.streak||0)+1 : 1;
    STORE.lastDay = k;
  }
  persist();
}

/* =========================================================
   学习会话
   ========================================================= */
function startSession(mode){
  const words = getWords(state.grade, state.sem, state.unit);
  if(!words.length){ toast('该单元暂无词汇'); return; }

  const now = Date.now();
  const withMeta = words.map(w => {
    const id = cardId(state.grade, state.sem, state.unit, w.en);
    const c = STORE.cards[id];
    const due = c && c.due ? new Date(c.due).getTime() : 0;
    return {...w, id, due};
  });

  const dueList = withMeta.filter(w => w.due <= now).sort((a,b)=>a.due-b.due);
  const rest = shuffle(withMeta.filter(w => w.due > now));
  let queue = [...dueList, ...rest];
  if(queue.length > 30) queue = queue.slice(0, 30);

  state.queue = queue; state.idx = 0; state.mode = mode;
  state.stats = {right:0, wrong:0}; state.wrongWords = []; state.extraDone = {};
  state.flipped = false; state.options = null; state.answered = false;
  state.picked = null; state.spellingValue = ''; state.view = 'study'; state.lessonOpen = false;

  render();
  if(mode === 'listen') setTimeout(()=>speak(currentWord().en), 350);
}

function currentWord(){ return state.queue[state.idx]; }

function nextCard(){
  state.flipped = false; state.options = null; state.answered = false;
  state.picked = null; state.spellingValue = ''; state.idx++;
  if(state.idx >= state.queue.length){ state.view = 'result'; render(); return; }
  render();
  if(state.mode === 'listen') setTimeout(()=>speak(currentWord().en), 300);
}

function judge(quality){
  const w = currentWord();
  if(!w) return;
  const correct = quality >= 3;
  updateCardSM2(w.id, quality);
  recordDaily();
  if(correct){ state.stats.right++; vibrate(30); }
  else {
    state.stats.wrong++; vibrate([100,50,100]);
    if(!state.wrongWords.find(x=>x.en===w.en)) state.wrongWords.push(w);
    const cnt = state.extraDone[w.en] || 0;
    if(cnt < 1){ state.extraDone[w.en] = cnt+1; state.queue.push({...w}); }
  }
  nextCard();
}

function makeOptions(word){
  const all = getWords(state.grade, state.sem, state.unit);
  const others = shuffle(all.filter(w => w.en !== word.en));
  return shuffle([word, ...others.slice(0,3)]);
}

function initSwipe(el){
  let startX = 0, startY = 0, startTime = 0;
  const minDistance = 40, maxTime = 600;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; startTime = Date.now();
  }, {passive:true});
  el.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const distX = t.clientX - startX, distY = t.clientY - startY;
    const elapsed = Date.now() - startTime;
    if(elapsed <= maxTime && Math.abs(distX) >= minDistance && Math.abs(distX) >= Math.abs(distY)){
      if(distX < 0){ if(state.mode === 'card' && !state.answered){ state.flipped ? judge(1) : toast('请先翻转卡片查看答案'); } }
      else { if(state.mode === 'card' && !state.answered){ state.flipped ? judge(4) : toast('请先翻转卡片查看答案'); } }
    }
  }, {passive:true});
}

      ` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px">
        <button class="btn btn-ghost" data-action="back-modes">换个模式</button>
        <button class="btn btn-primary" data-action="restart">再来一轮</button>
      </div>
    </div>
  `;
}

/* =========================================================
   事件处理
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action;
  if(act === 'close-lesson'){ closeLesson(); return; }
  if(act === 'speak'){ e.stopPropagation(); speak(el.dataset.word); return; }
  if(act === 'flip'){ state.flipped = !state.flipped; render(); return; }
  if(act === 'judge'){ judge(+el.dataset.q); return; }
  if(act === 'open-lesson'){ e.stopPropagation(); openLesson(); return; }
  if(act === 'next'){ nextCard(); return; }
  if(act === 'back-modes'){ state.view='modes'; render(); return; }
  if(act === 'restart'){ startSession(state.mode); return; }
  if(act === 'submit-spell'){ submitSpell(); return; }
  if(act === 'pick-unit'){ state.unit = +el.dataset.unit; state.view='modes'; render(); return; }
  
  if(act === 'pick-mode'){ 
    if(el.dataset.mode === 'lesson') {
      openLesson();
    } else {
      startSession(el.dataset.mode); 
    }
    return; 
  }
  
  if(act === 'answer'){
    if(state.answered) return;
    const w = currentWord();
    const picked = state.options.find(o => o.en === el.dataset.en);
    state.picked = picked; state.answered = true;
    const isRight = el.dataset.en === w.en;
    render();
    setTimeout(() => judge(isRight ? 4 : 1), 850);
    return;
  }
});

$('lessonOverlay').addEventListener('click', e => { if(e.target === $('lessonOverlay')) closeLesson(); });

function submitSpell(){
  if(state.answered) return;
  const inp = $('spellInput');
  if(!inp) return;
  const val = inp.value.trim().toLowerCase();
  const w = currentWord();
  if(!val){ toast('请先输入答案'); return; }
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const isRight = norm(val) === norm(w.en);
  state.spellingValue = inp.value;
  state.picked = isRight ? 'right' : 'wrong';
  state.answered = true;
  render();
  if(isRight){ speak(w.en); vibrate(30); setTimeout(() => judge(5), 700); }
  else { vibrate([100,50,100]); setTimeout(() => { speak(w.en); judge(2); }, 900); }
}

$('backBtn').addEventListener('click', () => {
  if(state.view === 'study' || state.view === 'result'){ state.view = 'modes'; }
  else if(state.view === 'modes'){ state.view = 'units'; }
  render();
});

$('homeBtn').addEventListener('click', () => {
  if(state.view === 'home' || state.view === 'units') return;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  closeLesson(); state.view = 'home'; render();
});

document.addEventListener('keydown', e => {
  if(state.lessonOpen) return;
  if(state.view !== 'study') return;
  if(state.mode === 'card' && e.code === 'Space'){ e.preventDefault(); state.flipped = !state.flipped; render(); }
  if(e.key === 'Enter' && state.mode !== 'spell'){ if(state.answered){ e.preventDefault(); nextCard(); } }
});

render();
</script>
</body>
