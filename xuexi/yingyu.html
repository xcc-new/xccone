<title>五年级上册 · 人教PEP版</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#4f7cff;--primary-d:#3a63dd;--primary-l:#eaf0ff;
  --accent:#ff9f43;--ok:#26c281;--ok-l:#e6f9f1;--bad:#ee5253;--bad-l:#feecec;
  --bg:#f2f5fb;--card:#fff;--text:#22304a;--muted:#8698b8;--line:#e6ecf7;
  --shadow:0 6px 20px rgba(63,94,160,.10);
  --radius:20px;
}
html{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.hidden{display:none!important}
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:14px 16px 12px;background:rgba(242,245,251,.92);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border:none;border-radius:12px;background:#fff;
  color:var(--text);font-size:17px;cursor:pointer;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
.icon-btn:active{transform:scale(.92)}
.header-txt{flex:1;min-width:0}
.header-txt h1{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-txt p{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;padding:4px 16px 40px}
.hero{text-align:center;padding:18px 0 22px}
.hero-emoji{font-size:46px;line-height:1;margin-bottom:10px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero h2{font-size:20px;font-weight:800;margin-bottom:6px}
.hero p{font-size:13px;color:var(--muted)}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 10px;letter-spacing:.5px}
.unit-list{display:flex;flex-direction:column;gap:10px}
.unit-item{
  display:flex;align-items:center;gap:13px;background:#fff;border:none;border-radius:16px;
  padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;text-align:left;width:100%;
  font-family:inherit;
}
.unit-item:active{transform:scale(.98)}
.unit-badge{
  width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:var(--primary-l);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
}
.unit-info{flex:1;min-width:0}
.unit-info .t{font-size:14.5px;font-weight:700;color:var(--text)}
.unit-info .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.unit-bar{height:5px;background:#eef2fa;border-radius:3px;margin-top:7px;overflow:hidden}
.unit-bar i{display:block;height:100%;background:linear-gradient(90deg,#4facfe,#4f7cff);border-radius:3px;transition:width .4s}
.unit-arrow{color:#c7d3e8;font-size:18px;font-weight:700}
.mode-list{display:flex;flex-direction:column;gap:11px}
.mode-item{
  display:flex;align-items:center;gap:14px;background:#fff;border:none;border-radius:16px;
  padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;text-align:left;width:100%;
  font-family:inherit;
}
.mode-item:active{transform:scale(.98)}
.mode-emoji{font-size:26px;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--primary-l);display:flex;align-items:center;justify-content:center}
.mode-item:nth-child(2) .mode-emoji{background:#fff2e3}
.mode-item:nth-child(3) .mode-emoji{background:#e8f8f1}
.mode-item:nth-child(4) .mode-emoji{background:#f3ecff}
.mode-item:nth-child(5) .mode-emoji{background:#ffecec}
.mode-info{flex:1}
.mode-info .t{font-size:14.5px;font-weight:700}
.mode-info .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.study-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-wrap{flex:1;height:8px;background:#e6ecf7;border-radius:4px;overflow:hidden}
.progress-wrap i{display:block;height:100%;background:linear-gradient(90deg,#43cea2,#4f7cff);border-radius:4px;transition:width .35s}
.study-count{font-size:12.5px;font-weight:700;color:var(--muted);min-width:44px;text-align:right}
.flashcard{perspective:1400px;height:290px;cursor:pointer;margin-bottom:20px}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;box-shadow:0 10px 30px rgba(63,94,160,.14);background:#fff;
}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,#f7faff,#eef4ff)}
.fc-word{font-size:40px;font-weight:800;letter-spacing:-.5px;color:var(--text);word-break:break-word;text-align:center;line-height:1.15}
.fc-phonetic{font-size:16px;color:var(--muted);margin-top:12px;font-family:"Times New Roman",serif}
.fc-zh{font-size:34px;font-weight:800;color:var(--primary);text-align:center;line-height:1.25}
.fc-word-sm{font-size:17px;color:var(--muted);margin-top:12px;font-weight:600}
.fc-hint{position:absolute;bottom:18px;font-size:11.5px;color:#b6c4dc;letter-spacing:.5px}
.speak-btn{
  margin-top:16px;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:var(--primary-l);color:var(--primary);font-size:22px;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;font-family:inherit;
}
.speak-btn:active{transform:scale(.9)}
.btn{
  border:none;border-radius:16px;padding:16px;font-size:15.5px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .15s;color:#fff;
}
.btn:active{transform:scale(.96)}
.btn-ok{background:linear-gradient(135deg,#3ddc97,#26c281);box-shadow:0 6px 18px rgba(38,194,129,.3)}
.btn-bad{background:linear-gradient(135deg,#ff7b7b,#ee5253);box-shadow:0 6px 18px rgba(238,82,83,.3)}
.btn-primary{background:linear-gradient(135deg,#6a92ff,#4f7cff);box-shadow:0 6px 18px rgba(79,124,255,.3);width:100%}
.btn-ghost{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.quiz-q{text-align:center;margin-bottom:22px}
.quiz-q .label{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:10px}
.quiz-q .main{font-size:42px;font-weight:800;line-height:1.15;word-break:break-word}
.quiz-q .sub{font-size:15px;color:var(--muted);margin-top:8px}
.quiz-audio{
  width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;margin:6px auto 0;
  background:linear-gradient(135deg,#8e7bff,#5a44e0);color:#fff;font-size:38px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(110,90,224,.35);
  transition:transform .15s;font-family:inherit;
}
.quiz-audio:active{transform:scale(.92)}
.opt-list{display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:16px;
  padding:15px 17px;cursor:pointer;box-shadow:var(--shadow);font-size:16px;font-weight:600;
  font-family:inherit;color:var(--text);text-align:left;transition:all .2s;
}
.opt:active{transform:scale(.985)}
.opt .k{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#eef2fa;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
}
.opt.correct{border-color:var(--ok);background:var(--ok-l)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.spell-box{background:#fff;border-radius:22px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;margin-bottom:20px}
.spell-zh{font-size:30px;font-weight:800;color:var(--primary);margin-bottom:8px}
.spell-ph{font-size:14px;color:var(--muted);font-family:"Times New Roman",serif;margin-bottom:20px}
.spell-input{
  width:100%;border:2.5px solid var(--line);border-radius:15px;padding:15px;font-size:20px;
  text-align:center;font-family:inherit;font-weight:700;color:var(--text);outline:none;transition:.2s;
  letter-spacing:1px;
}
.spell-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,124,255,.12)}
.spell-input.correct{border-color:var(--ok);background:var(--ok-l);color:var(--ok)}
.spell-input.wrong{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.spell-answer{font-size:15px;color:var(--muted);margin-top:14px;min-height:22px}
.spell-answer b{color:var(--ok);font-size:17px}
.result-wrap{text-align:center;padding:26px 0}
.result-emoji{font-size:64px;line-height:1;margin-bottom:14px}
.result-wrap h2{font-size:22px;font-weight:800;margin-bottom:8px}
.result-wrap .sub{font-size:13.5px;color:var(--muted);margin-bottom:24px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:22px}
.rstat{background:#fff;border-radius:16px;padding:16px 8px;box-shadow:var(--shadow)}
.rstat .n{font-size:24px;font-weight:800;line-height:1}
.rstat .l{font-size:11px;color:var(--muted);margin-top:6px}
.rstat.ok .n{color:var(--ok)}
.rstat.bad .n{color:var(--bad)}
.rstat.acc .n{color:var(--primary)}
.wrong-list{text-align:left;background:#fff;border-radius:18px;padding:6px 16px;box-shadow:var(--shadow);margin-bottom:20px;max-height:220px;overflow:auto}
.wrong-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.wrong-item:last-child{border-bottom:none}
.wrong-item .en{font-size:15px;font-weight:700}
.wrong-item .zh{font-size:13px;color:var(--muted)}
.wrong-item .spk{border:none;background:var(--primary-l);color:var(--primary);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:14px;flex:0 0 32px}
.lesson-overlay{
  position:fixed;inset:0;background:rgba(34,48,74,.6);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .25s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.lesson-overlay.show{opacity:1;pointer-events:auto}
.lesson-modal{
  background:#fff;border-radius:24px;width:100%;max-width:520px;
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(34,48,74,.3);
  transform:scale(.95);transition:transform .25s;
}
.lesson-overlay.show .lesson-modal{transform:scale(1)}
.lesson-header{
  padding:18px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;
}
.lesson-header h3{font-size:16px;font-weight:800}
.lesson-close{
  width:32px;height:32px;border:none;border-radius:10px;background:#f2f5fb;
  color:var(--muted);font-size:16px;cursor:pointer;font-family:inherit;
}
.lesson-body{padding:16px 20px;overflow-y:auto;flex:1}
.lesson-line{
  display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);
}
.lesson-line:last-child{border-bottom:none}
.lesson-line .who{
  flex:0 0 auto;font-size:12px;font-weight:800;color:var(--primary);
  background:var(--primary-l);padding:3px 8px;border-radius:8px;height:fit-content;min-width:52px;text-align:center;
}
.lesson-line .say{flex:1}
.lesson-line .en{font-size:15px;font-weight:600;color:var(--text);line-height:1.4}
.lesson-line .zh{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.lesson-audio-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;margin:8px 0;
  background:#f7f9ff;border-radius:13px;cursor:pointer;transition:background .2s;
  border:1.5px solid transparent;
}
.lesson-audio-item:active{background:#eaf0ff}
.lesson-audio-item.playing{background:#e8f0ff;border-color:var(--primary)}
.lesson-audio-play{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;
}
.lesson-audio-item.playing .lesson-audio-play{background:var(--ok)}
.lesson-audio-info{flex:1}
.lesson-audio-title{font-size:14.5px;font-weight:700;color:var(--text)}
.lesson-speak{
  border:none;background:var(--primary-l);color:var(--primary);width:28px;height:28px;
  border-radius:9px;cursor:pointer;font-size:13px;flex:0 0 28px;font-family:inherit;
}
.toast{
  position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-16px);
  background:rgba(34,48,74,.94);color:#fff;padding:11px 20px;border-radius:14px;font-size:13.5px;
  font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:.28s;backdrop-filter:blur(8px);
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.fade-in{animation:pop .3s ease}
.wrongbook-card{
  display:flex;align-items:center;gap:13px;width:100%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#fff5f5,#ffe3e3);border-radius:16px;padding:15px 16px;
  box-shadow:0 6px 20px rgba(238,82,83,.12);transition:transform .15s;text-align:left;
  font-family:inherit;margin-bottom:6px;
}
.wrongbook-card:active{transform:scale(.98)}
.wb-emoji{
  width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:#fff;color:#ee5253;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.wb-info{flex:1;min-width:0}
.wb-info .t{font-size:15px;font-weight:800;color:#c0392b}
.wb-info .s{font-size:12px;color:#e07a6a;margin-top:3px}
.lesson-entry{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:#fff;border:2px dashed #c7d3e8;border-radius:16px;padding:15px;
  cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--text);
  box-shadow:var(--shadow);transition:transform .15s;
}
.lesson-entry:active{transform:scale(.98)}
.history-overlay{
  position:fixed;inset:0;background:rgba(34,48,74,.6);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .25s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.history-overlay.show{opacity:1;pointer-events:auto}
.history-modal{
  background:#fff;border-radius:24px;width:100%;max-width:520px;
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(34,48,74,.3);
  transform:scale(.95);transition:transform .25s;
}
.history-overlay.show .history-modal{transform:scale(1)}
.history-header{
  padding:18px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.history-header h3{font-size:16px;font-weight:800}
.history-close{
  width:32px;height:32px;border:none;border-radius:10px;background:#f2f5fb;
  color:var(--muted);font-size:16px;cursor:pointer;font-family:inherit;
}
.history-body{padding:12px 20px;overflow-y:auto;flex:1}
.history-item{
  display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line);
}
.history-item:last-child{border-bottom:none}
.hi-date{flex:0 0 62px}
.hi-date .d{font-size:13px;font-weight:800;color:var(--text)}
.hi-date .t{font-size:11px;color:var(--muted);margin-top:2px}
.hi-info{flex:1}
.hi-info .u{font-size:14px;font-weight:700}
.hi-info .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.hi-score{flex:0 0 auto;text-align:right}
.hi-score .n{font-size:15px;font-weight:800}
.hi-score .n.ok{color:var(--ok)}
.hi-score .n.bad{color:var(--bad)}
.hi-score .l{font-size:10.5px;color:var(--muted)}
.history-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.as-overlay{
  position:fixed;inset:0;background:rgba(34,48,74,.6);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.as-overlay.show{opacity:1;pointer-events:auto}
.as-modal{
  background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:560px;
  max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(100%);transition:transform .25s;
  padding:20px 20px 28px;
}
.as-overlay.show .as-modal{transform:translateY(0)}
.as-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.as-header h3{font-size:16px;font-weight:800}
.as-close{
  width:32px;height:32px;border:none;border-radius:10px;background:#f2f5fb;
  color:var(--muted);font-size:16px;cursor:pointer;font-family:inherit;
}
.as-stats{display:flex;gap:10px;margin-bottom:16px}
.as-stat{
  flex:1;text-align:center;padding:10px;border-radius:12px;background:#f7f9fd;
}
.as-stat .n{font-size:20px;font-weight:800;line-height:1}
.as-stat .l{font-size:11px;color:var(--muted);margin-top:4px}
.as-stat.ok .n{color:var(--ok)}
.as-stat.bad .n{color:var(--bad)}
.as-stat.todo .n{color:var(--muted)}
.as-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
  overflow-y:auto;padding-bottom:8px;
}
.as-item{
  aspect-ratio:1;border:none;border-radius:12px;cursor:pointer;
  background:#eef2fa;color:var(--text);font-size:15px;font-weight:700;
  font-family:inherit;transition:transform .1s;
  display:flex;align-items:center;justify-content:center;
}
.as-item:active{transform:scale(.92)}
.as-item.right{background:var(--ok);color:#fff}
.as-item.wrong{background:var(--bad);color:#fff}
.as-item.current{outline:3px solid var(--primary);outline-offset:1px}
.as-legend{

/* =========================================================
   本地音频路径映射（与 audio/ 目录下的 MP3 一一对应）
   上传 GitHub 时，请把 audio 文件夹和本 HTML 放在同一目录
   ========================================================= */
function safeAudioName(word) {
  return String(word).replace(/[\\/:*?"<>|]/g, '_').trim();
}
function getAudioBase() {
  const path = location.pathname;
  const idx = path.lastIndexOf('/');
  const dir = idx >= 0 ? path.substring(0, idx + 1) : '/';
  return dir + 'audio/';
}
const AUDIO_BASE = getAudioBase();
function buildAudioMap() {
  const map = {};
  for (const sem in WORD_DATA) {
    const units = WORD_DATA[sem] || {};
    for (const u in units) {
      units[u].forEach((item, idx) => {
        const en = item[0];
        const fname = String(idx + 1).padStart(2, '0') + '_' + safeAudioName(en) + '.mp3';
        map[en.toLowerCase()] = AUDIO_BASE + 'Unit' + u + '/' + encodeURIComponent(fname);
      });
    }
  }
  return map;
}
const AUDIO_MAP = buildAudioMap();
function buildLessonAudioMap() {
  const map = {};
  for (const u in LESSON_BOOK) {
    const parts = LESSON_BOOK[u];
    for (const part in parts) {
      parts[part].forEach((line, idx) => {
        const fname = part + '_' + String(idx + 1).padStart(2, '0') + '.mp3';
        map[line[1].trim().toLowerCase()] = AUDIO_BASE + 'lessons/Unit' + u + '/' + fname;
      });
    }
  }
  return map;
}

const STORE_KEY = 'pep_words_v5';
let STORE = (() => {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        if (!parsed.cards) parsed.cards = {};
        if (!parsed.daily) parsed.daily = {};
        if (typeof parsed.streak !== 'number') parsed.streak = 0;
        if (!parsed.lastDay) parsed.lastDay = '';
        if (!parsed.history) parsed.history = [];
        return parsed;
      }
    }
  } catch(e) {}
  return {cards:{}, daily:{}, streak:0, lastDay:'', history:[]};
})();
function persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); } catch(e){} }

const $ = id => document.getElementById(id);
const main = $('main');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg, ms=1600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),ms); }
function getWords(g,s,u){ const raw = WORD_DATA[`${g}${s}`]?.[u]; if(!raw) return []; return raw.map(a=>({en:a[0],zh:a[1],ph:a[2]||''})); }
function cardId(g,s,u,en){ return `${g}${s}${u}::${en}`; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function countWords(g){ let n=0; for(const s of ['上','下']) for(const u in (WORD_DATA[`${g}${s}`]||{})) n += WORD_DATA[`${g}${s}`][u].length; return n; }
function unitTotal(g,s,u){ return (WORD_DATA[`${g}${s}`]?.[u]||[]).length; }
function isMastered(id){ const c = STORE.cards[id]; return !!(c && c.interval >= 6); }
function inWrongbook(id){
  const c = STORE.cards[id];
  return !!(c && c.wrong > 0 && (c.right||0) < 2);
}
function getWrongCount(){
  let n = 0;
  for (const sem in WORD_DATA) for (const u in WORD_DATA[sem])
    WORD_DATA[sem][u].forEach(a => {
      if (inWrongbook(cardId(state.grade, state.sem, u, a[0]))) n++;
    });
  return n;
}
function getWrongWords(){
  const list = [];
  for (const sem in WORD_DATA) for (const u in WORD_DATA[sem])
    WORD_DATA[sem][u].forEach(a => {
      const id = cardId(state.grade, state.sem, u, a[0]);
      if (inWrongbook(id)) list.push({en:a[0], zh:a[1], ph:a[2]||'', id, unit:u});
    });
  return shuffle(list);
}

function speak(text, rate = 0.82) {
  if (!text) return;
  // 停止当前正在播放的内容
  if (window._currentAudio) {
    try { window._currentAudio.pause(); } catch(e){}
    window._currentAudio = null;
  }
  if ('speechSynthesis' in window) {
    try { speechSynthesis.cancel(); } catch(e){}
  }

  // 方案 0：本地 MP3（单词优先，其次课文句子）
  const key = String(text).trim().toLowerCase();
  const localPath = AUDIO_MAP[key] || LESSON_AUDIO_MAP[key];
  if (localPath) {
    tryLocalAudio(localPath, () => {
      console.warn('本地 MP3 加载失败，降级到在线 TTS:', localPath);
      speakOnline(text, rate);
    });
    return;
  }

  speakOnline(text, rate);
}

/* 播放本地 MP3，失败回调 */
function tryLocalAudio(path, onFail) {
  const audio = new Audio();
  audio.volume = 1;
  audio.playbackRate = 1.0;  // 本地 MP3 已是适合学习的语速，原速播放
  let failed = false;
  const fail = () => {
    if (failed) return;
    failed = true;
    try { audio.pause(); } catch(e){}
    onFail();
  };
  const timer = setTimeout(fail, 5000);
  audio.oncanplay = () => clearTimeout(timer);
  audio.onerror = () => { clearTimeout(timer); fail(); };
  audio.src = path;
  window._currentAudio = audio;
  audio.play().then(() => {
    clearTimeout(timer);
  }).catch(e => {
    clearTimeout(timer);
    if (e.name !== 'AbortError') fail();
  });
}

/* 在线 TTS（百度 → 有道 → 系统兜底），供本地 MP3 失败或课文长句使用 */
function speakOnline(text, rate) {
  const baiduUrl = `https://fanyi.baidu.com/gettts?lan=en&text=${encodeURIComponent(text)}&spd=3&source=web`;
  tryOnlineAudio(baiduUrl, rate, () => {
    const youdaoUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`;
    tryOnlineAudio(youdaoUrl, rate, () => {
      console.warn('所有在线 TTS 均失败，降级到系统语音');
      fallbackToSystem(text, rate);
    });
  });
}

/* 尝试播放指定 URL 的音频，失败则调用 onFail */
function tryOnlineAudio(url, rate, onFail) {
  const audio = new Audio();
  audio.volume = 1;
  audio.playbackRate = rate;
  audio.crossOrigin = 'anonymous';
  let failed = false;
  const fail = () => {
    if (failed) return;
    failed = true;
    try { audio.pause(); } catch(e){}
    onFail();
  };
  const timer = setTimeout(fail, 4000);
  audio.oncanplay = () => clearTimeout(timer);
  audio.onerror = () => { clearTimeout(timer); fail(); };
  audio.src = url;
  window._currentAudio = audio;
  audio.play().then(() => {
    clearTimeout(timer);
  }).catch(e => {
    clearTimeout(timer);
    if (e.name !== 'AbortError') {
      fail();
    }
  });
}

/* 系统 TTS 兜底 */
function fallbackToSystem(text, rate) {
  if (!('speechSynthesis' in window)) {
    toast('无法播放发音，请检查网络');
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate;
  u.volume = 1;
  const voices = speechSynthesis.getVoices();
  const voice =
    voices.find(v => /en-US/i.test(v.lang) && /Google|Samantha|Aria/i.test(v.name)) ||
    voices.find(v => /en-US/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang));
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
/* =========================================================
   SM-2 间隔重复算法
   ========================================================= */
function updateCardSM2(id, quality){
  const c = STORE.cards[id] || {interval:0, repetition:0, efactor:2.5, due:null, right:0, wrong:0};
  if(quality < 3){
    c.repetition = 0; c.interval = 0; c.wrong = (c.wrong||0)+1;
    c.due = new Date(Date.now() + 5*60*1000).toISOString();
  } else {
    if(c.repetition === 0) c.interval = 1;
    else if(c.repetition === 1) c.interval = 6;
    else c.interval = Math.max(1, Math.round(c.interval * c.efactor));
    c.repetition = (c.repetition||0)+1; c.right = (c.right||0)+1;
    const d = new Date(); d.setDate(d.getDate() + c.interval); c.due = d.toISOString();
  }
  c.efactor = Math.max(1.3, (c.efactor||2.5) + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  c.lastQuality = quality; c.updatedAt = Date.now();
  STORE.cards[id] = c; persist();
}
function recordDaily(){
  const k = todayKey();
  STORE.daily[k] = (STORE.daily[k]||0)+1;
  if(STORE.lastDay !== k){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yk = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
    STORE.streak = (STORE.lastDay === yk) ? (STORE.streak||0)+1 : 1;
    STORE.lastDay = k;
  }
  persist();
}
/* =========================================================
   学习会话
   ========================================================= */
function startSession(mode){
  let words;
  if (state.wrongMode) {
    words = getWrongWords();
    if (!words.length) { toast('暂无错题，先去做几道题吧'); state.wrongMode = false; state.view = 'home'; render(); return; }
  } else {
    words = getWords(state.grade, state.sem, state.unit).map(w => ({
      ...w, id: cardId(state.grade, state.sem, state.unit, w.en)
    }));
    if (!words.length){ toast('该单元暂无词汇'); return; }
  }
  const now = Date.now();
  const withMeta = words.map(w => ({...w, due: (STORE.cards[w.id] && STORE.cards[w.id].due) ? new Date(STORE.cards[w.id].due).getTime() : 0}));
  const dueList = withMeta.filter(w => w.due <= now).sort((a,b)=>a.due-b.due);
  const rest = shuffle(withMeta.filter(w => w.due > now));
  let queue = [...dueList, ...rest];
  if(queue.length > 50) queue = queue.slice(0, 50);
  state.queue = queue.map(w => ({...w, _status: null})); state.idx = 0; state.mode = mode;
  state.stats = {right:0, wrong:0}; state.wrongWords = []; state.extraDone = {};
  state.flipped = false; state.options = null; state.answered = false;
  state.picked = null; state.spellingValue = ''; state.view = 'study'; state.lessonOpen = false;
  render();
  if(mode === 'listen') setTimeout(()=>speak(currentWord().en), 350);
}
function currentWord(){ return state.queue[state.idx]; }
function nextCard(){
  state.flipped = false; state.options = null; state.answered = false;
  state.picked = null; state.spellingValue = ''; state.idx++;
  if(state.idx >= state.queue.length){ state.view = 'result'; render(); return; }
  render();
  if(state.mode === 'listen') setTimeout(()=>speak(currentWord().en), 300);
}
function judge(quality){
  const w = currentWord();
  if(!w) return;
  const correct = quality >= 3;
  w._status = correct ? 'right' : 'wrong';
  updateCardSM2(w.id, quality);
  recordDaily();
  if(correct){ state.stats.right++; vibrate(30); }
  else {
    state.stats.wrong++; vibrate([100,50,100]);
    if(!state.wrongWords.find(x=>x.en===w.en)) state.wrongWords.push(w);
  }
  nextCard();
}
function makeOptions(word){
  let pool;
  if (state.wrongMode) {
    pool = [];
    for (const sem in WORD_DATA) for (const u in WORD_DATA[sem])
      WORD_DATA[sem][u].forEach(a => pool.push({en:a[0], zh:a[1]}));
  } else {
    pool = getWords(state.grade, state.sem, state.unit);
  }
  const others = shuffle(pool.filter(w => w.en !== word.en));
  return shuffle([word, ...others.slice(0,3)]);
}

function initSwipe(el){
  let startX = 0, startY = 0, startTime = 0, pressed = false;
  const minDistance = 50, maxTime = 700;

  function onStart(x, y){
    startX = x; startY = y; startTime = Date.now(); pressed = true;
  }
  function onEnd(x, y){
    if(!pressed) return;
    pressed = false;
    const distX = x - startX, distY = y - startY;
    const elapsed = Date.now() - startTime;
    if(elapsed > maxTime || Math.abs(distX) < minDistance || Math.abs(distX) < Math.abs(distY)) return;
    if(distX < 0){ nextCard(); }
    else {
      if(state.idx > 0) prevCard();
      else toast('已经是第一题了');
    }
  }

  // 触摸
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, {passive:true});
  el.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    onEnd(t.clientX, t.clientY);
  }, {passive:true});

  // 鼠标（电脑上测试用）
  el.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  el.addEventListener('mouseup', e => onEnd(e.clientX, e.clientY));
}
let _lessonAudio = null;
function openLesson(){
  const key = `${state.grade}${state.sem}`;
  const book = LESSON_BOOK[state.unit];
  const title = (UNIT_TITLES[key] || [])[state.unit-1] || `Unit ${state.unit}`;
  $('lessonTitle').textContent = `Unit ${state.unit} · ${title}`;
  if(_lessonAudio){ try{_lessonAudio.pause();}catch(e){} _lessonAudio = null; }
  if(!book){ $('lessonBody').innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted)">本单元暂无课文</div>'; $('lessonOverlay').classList.add('show'); state.lessonOpen = true; return; }
  const sections = [
    {k:'A_talk', t:'Part A · Let\'s talk', color:'#eaf0ff', bg:'#eaf0ff'},
    {k:'A_learn', t:'Part A · Let\'s learn', color:'#eaf0ff', bg:'#eaf0ff'},
    {k:'B_talk', t:'Part B · Let\'s talk', color:'#fdeaea', bg:'#fdeaea'},
    {k:'B_learn', t:'Part B · Let\'s learn', color:'#fdeaea', bg:'#fdeaea'},
  ];
  let html = '';
  sections.forEach(sec => {
    const lines = book[sec.k];
    if(!lines || !lines.length) return;
    html += `<div style="margin:14px 0 6px;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:800;color:var(--primary);background:${sec.bg}">${sec.t}</div>`;
    lines.forEach(l => {
      const who = l[0];
      const en = l[1];
      const zh = l[2];
      const isExample = (who === '例句');
      html += `
        <div style="display:flex;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line)">
          <span style="flex:0 0 auto;font-size:11px;font-weight:800;color:${isExample?'#8698b8':'var(--primary)'};background:${isExample?'#f2f5fb':'var(--primary-l)'};padding:2px 7px;border-radius:6px;height:fit-content;min-width:48px;text-align:center">${esc(who)}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:14.5px;font-weight:600;color:var(--text);line-height:1.45">${esc(en)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4">${esc(zh)}</div>
          </div>
          <button style="flex:0 0 30px;height:30px;border:none;border-radius:9px;background:var(--primary-l);color:var(--primary);cursor:pointer;font-size:14px" data-action="speak" data-word="${esc(en)}">🔊</button>
        </div>`;
    });
  });
  $('lessonBody').innerHTML = html;
  $('lessonOverlay').classList.add('show');
  state.lessonOpen = true;
}
function closeLesson(){ if(_lessonAudio){try{_lessonAudio.pause();}catch(e){} _lessonAudio=null;} $('lessonOverlay').classList.remove('show'); state.lessonOpen = false; }
function openHistory(){
  const h = STORE.history || [];
  const body = $('historyBody');
  if (!h.length) {
    body.innerHTML = '<div class="history-empty">还没有做题记录，开始第一轮练习吧</div>';
  } else {
    body.innerHTML = h.map(r => {
      const acc = r.total ? Math.round(r.right/r.total*100) : 0;
      return `<div class="history-item">
        <div class="hi-date"><div class="d">${r.date.slice(5)}</div><div class="t">${r.time||''}</div></div>
        <div class="hi-info"><div class="u">${r.unit}</div><div class="m">${r.mode} · 正确率${acc}%</div></div>
        <div class="hi-score">
          <div class="n"><span style="color:var(--ok)">${r.right}</span> / <span style="color:var(--bad)">${r.wrong}</span></div>
          <div class="l">对/错</div>
        </div>
      </div>`;
    }).join('');
  }
  $('historyOverlay').classList.add('show');
}
function closeHistory(){ $('historyOverlay').classList.remove('show'); }
function openAnswerSheet(){
  let right=0, wrong=0, todo=0;
  state.queue.forEach((w,i) => {
    if (w._status === 'right') right++;
    else if (w._status === 'wrong') wrong++;
    else todo++;
  });
  $('asStats').innerHTML = `
    <div class="as-stat ok"><div class="n">${right}</div><div class="l">答对</div></div>
    <div class="as-stat bad"><div class="n">${wrong}</div><div class="l">答错</div></div>
    <div class="as-stat todo"><div class="n">${todo}</div><div class="l">未答</div></div>
  `;
  $('asGrid').innerHTML = state.queue.map((w,i) => {
    let cls = 'as-item';
    if (i === state.idx) cls += ' current';
    if (w._status === 'right') cls += ' right';
    else if (w._status === 'wrong') cls += ' wrong';
    return `<button class="${cls}" data-action="jump-to" data-idx="${i}">${i+1}</button>`;
  }).join('');
  $('asOverlay').classList.add('show');
}
function closeAnswerSheet(){ $('asOverlay').classList.remove('show'); }
function jumpTo(idx){
  if (idx < 0 || idx >= state.queue.length) return;
  state.idx = idx;
  state.flipped = false; state.options = null; state.answered = false;
  state.picked = null; state.spellingValue = '';
  closeAnswerSheet();
  render();
}
function renderResult(){
  // 保存历史记录
  try {
    const total = state.stats.right + state.stats.wrong;
    if (total > 0) {
      STORE.history.unshift({
        date: todayKey(),
        time: new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}),
        unit: state.wrongMode ? '错题复习' : ('Unit ' + state.unit),
        mode: ({card:'单词卡',en2zh:'看词选义',zh2en:'看义选词',listen:'听音选词',spell:'拼写'})[state.mode] || state.mode,
        total: total,
        right: state.stats.right,
        wrong: state.stats.wrong
      });
      if (STORE.history.length > 100) STORE.history = STORE.history.slice(0, 100);
      persist();
    }
  } catch(e){}
  setHeader('本轮结束', '看看你的表现', true);
  const {right, wrong} = state.stats;
  const total = right + wrong;
  const acc = total ? Math.round(right/total*100) : 0;
  let emoji = '🌱', msg = '继续加油！';
  if(acc >= 90){ emoji = '🏆'; msg = '太棒了，几乎全对！'; }
  else if(acc >= 75){ emoji = '🎉'; msg = '做得很好，再练一次更稳！'; }
  else if(acc >= 60){ emoji = '💪'; msg = '不错，多复习几遍就记住啦！'; }
  main.innerHTML = `
    <div class="result-wrap fade-in">
      <div class="result-emoji">${emoji}</div>
      <h2>${msg}</h2>
      <div class="sub">本轮共练习 ${total} 张卡片</div>
      <div class="result-stats">
        <div class="rstat acc"><div class="n">${acc}%</div><div class="l">正确率</div></div>
        <div class="rstat ok"><div class="n">${right}</div><div class="l">答对</div></div>
        <div class="rstat bad"><div class="n">${wrong}</div><div class="l">答错</div></div>
      </div>
      ${state.wrongWords.length ? `
        <div class="section-title" style="text-align:left;margin-left:4px">需要加强的单词</div>
        <div class="wrong-list">
          ${state.wrongWords.map(w => `
            <div class="wrong-item">
              <div><div class="en">${esc(w.en)}</div><div class="zh">${esc(w.zh)}</div></div>
              <button class="spk" data-action="speak" data-word="${esc(w.en)}">🔊</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px">
        <button class="btn btn-ghost" data-action="back-modes">换个模式</button>
        <button class="btn btn-primary" data-action="restart">再来一轮</button>
      </div>
    </div>
  `;
}
/* =========================================================
   事件处理
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action;
  if(act === 'close-lesson'){ closeLesson(); return; }
  if(act === 'play-lesson'){
    document.querySelectorAll('.lesson-audio-item.playing').forEach(x=>x.classList.remove('playing'));
    playLessonAudio(el.dataset.audio, el);
    return;
  }
  if(act === 'speak'){ e.stopPropagation(); speak(el.dataset.word); return; }
  if(act === 'flip'){ state.flipped = !state.flipped; render(); return; }
  if(act === 'judge'){ judge(+el.dataset.q); return; }
  if(act === 'open-lesson'){ e.stopPropagation(); openLesson(); return; }
  if(act === 'next'){ nextCard(); return; }
  if(act === 'back-modes'){ state.view='modes'; render(); return; }
  if(act === 'restart'){ startSession(state.mode); return; }
  if(act === 'submit-spell'){ submitSpell(); return; }
  if(act === 'pick-unit'){ state.unit = +el.dataset.unit; state.wrongMode = false; state.view='modes'; render(); return; }
  if(act === 'enter-wrongbook'){ state.wrongMode = true; state.unit = null; state.view='modes'; render(); return; }
  if(act === 'clear-wrongbook'){
    if(confirm('确定要清空所有错题记录吗？')){
      for(const id in STORE.cards){
        if(STORE.cards[id] && STORE.cards[id].wrong > 0){
          STORE.cards[id].wrong = 0;
          STORE.cards[id].right = 0;
        }
      }
      persist();
      toast('错题本已清空');
      render();
    }
    return;
  }
  if(act === 'open-history'){ openHistory(); return; }
  if(act === 'close-history'){ closeHistory(); return; }
  if(act === 'open-as'){ openAnswerSheet(); return; }
  if(act === 'close-as'){ closeAnswerSheet(); return; }
  if(act === 'jump-to'){ jumpTo(+el.dataset.idx); return; }
  if(act === 'open-lesson-direct'){ openLesson(); return; }
  if(act === 'pick-mode'){ startSession(el.dataset.mode); return; }
  if(act === 'answer'){
    if(state.answered) return;
    const w = currentWord();
    const picked = state.options.find(o => o.en === el.dataset.en);
    state.picked = picked; state.answered = true;
    const isRight = el.dataset.en === w.en;
    render();
    setTimeout(() => judge(isRight ? 4 : 1), 850);
    return;
  }
});
$('lessonOverlay').addEventListener('click', e => { if(e.target === $('lessonOverlay')) closeLesson(); });
$('asOverlay').addEventListener('click', e => { if(e.target === $('asOverlay')) closeAnswerSheet(); });
$('historyOverlay').addEventListener('click', e => { if(e.target === $('historyOverlay')) closeHistory(); });
function submitSpell(){
  if(state.answered) return;
  const inp = $('spellInput');
  if(!inp) return;
  const val = inp.value.trim().toLowerCase();
  const w = currentWord();
  if(!val){ toast('请先输入答案'); return; }
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const isRight = norm(val) === norm(w.en);
  state.spellingValue = inp.value;
  state.picked = isRight ? 'right' : 'wrong';
  state.answered = true;
  render();
  if(isRight){ speak(w.en); vibrate(30); setTimeout(() => judge(5), 700); }
  else { vibrate([100,50,100]); setTimeout(() => { speak(w.en); judge(2); }, 900); }
}
$('backBtn').addEventListener('click', () => {
  if(state.view === 'study' || state.view === 'result'){ state.view = 'modes'; }
  else if(state.view === 'modes'){
    state.view = 'units';
    state.wrongMode = false;
    state.unit = null;
  }
  render();
});
$('homeBtn').addEventListener('click', () => {
  if(state.view === 'home' || state.view === 'units') return;
  if(window._currentAudio) { try { window._currentAudio.pause(); } catch(e){} window._currentAudio = null; }
  if('speechSynthesis' in window) try { speechSynthesis.cancel(); } catch(e){}
  closeLesson(); state.view = 'home'; state.wrongMode = false; state.unit = null; render();
});
document.addEventListener('keydown', e => {
  if(state.lessonOpen) return;
  if(state.view !== 'study') return;
  if(state.mode === 'card' && e.code === 'Space'){ e.preventDefault(); state.flipped = !state.flipped; render(); }
  if(e.key === 'Enter' && state.mode !== 'spell'){ if(state.answered){ e.preventDefault(); nextCard(); } }
});
render();
</script>
</body>
</html>
